<!DOCTYPE html>
<!-- 文件路径: login.html  —— 手机专用准入验证页 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b1b">
  <meta name="format-detection" content="telephone=no">
  <title>准入验证 - 幻想域</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: radial-gradient(120% 90% at 50% 0%, #242430 0%, #17171b 45%, #121214 100%);
      color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .page {
      min-height: 100%;
      padding: calc(env(safe-area-inset-top, 0px) + 32px) 22px calc(env(safe-area-inset-bottom, 0px) + 28px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    .brand { text-align: center; margin-bottom: 34px; }
    .brand .logo { font-size: 44px; line-height: 1; margin-bottom: 14px; }
    .brand h1 {
      margin: 0 0 8px; font-size: 23px; font-weight: 700; letter-spacing: .5px;
      background: linear-gradient(135deg, #a8b4ff, #7fd7ff);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand p { margin: 0; font-size: 13.5px; color: #8b8b96; letter-spacing: .3px; }

    .card {
      width: 100%; max-width: 420px;
      background: rgba(38, 38, 44, .92);
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 20px;
      padding: 26px 22px 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
      backdrop-filter: blur(8px);
    }

    .hint {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #d8b26a;
      background: rgba(216, 178, 106, .08);
      border: 1px solid rgba(216, 178, 106, .22);
      border-radius: 12px; padding: 11px 13px; margin-bottom: 18px;
      word-break: break-all; line-height: 1.5;
    }

    .field { position: relative; margin-bottom: 16px; }
    .field input {
      width: 100%; height: 54px;
      padding: 0 52px 0 16px;
      font-size: 17px;              /* ≥16px 防止 iOS 自动放大 */
      color: #f2f2f2; background: #1b1b1f;
      border: 1.5px solid #3a3a44; border-radius: 14px;
      outline: none; transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none; appearance: none;
    }
    .field input::placeholder { color: #62626e; font-size: 15px; }
    .field input:focus {
      border-color: #4a7dd6;
      box-shadow: 0 0 0 3px rgba(74, 125, 214, .18);
    }
    .field input.err { border-color: #c94f4f; box-shadow: 0 0 0 3px rgba(201, 79, 79, .16); }
    .eye {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 42px; height: 42px; border: none; background: transparent;
      color: #8b8b96; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
    }
    .eye:active { background: rgba(255, 255, 255, .06); }

    .btn-login {
      width: 100%; height: 54px; margin-top: 6px;
      border: none; border-radius: 14px;
      font-size: 17px; font-weight: 600; letter-spacing: 2px; color: #fff;
      background: linear-gradient(135deg, #4a7dd6, #3070c8);
      box-shadow: 0 8px 22px rgba(48, 112, 200, .32);
      transition: transform .12s, filter .2s;
      cursor: pointer; touch-action: manipulation;
    }
    .btn-login:active { transform: scale(.985); filter: brightness(.94); }
    .btn-login:disabled { filter: grayscale(.4) brightness(.8); box-shadow: none; }

    .error {
      height: 20px; margin-top: 12px; text-align: center;
      font-size: 13px; color: #ff7b7b; opacity: 0; transition: opacity .2s;
    }
    .error.show { opacity: 1; }
    .shake { animation: shake .38s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .foot {
      margin-top: 26px; text-align: center;
      font-size: 11.5px; color: #5a5a66; line-height: 1.9;
    }
    .foot a { color: #7fa8e8; text-decoration: none; }

    .toast {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
      transform: translateX(-50%) translateY(10px);
      background: rgba(40, 40, 46, .96); border: 1px solid #444;
      color: #eee; font-size: 13px; padding: 10px 18px; border-radius: 10px;
      opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
      z-index: 99; max-width: 86vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <div class="logo">📖</div>
      <h1>幻想域设定集</h1>
      <p>请输入远程访问码</p>
    </div>

    <div class="card" id="card">
      <div class="hint" id="hint">💡 正在读取提示…</div>

      <div class="field">
        <input
          id="pwd"
          type="password"
          inputmode="text"
          autocomplete="current-password"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="请输入远程访问码"
        >
        <button class="eye" id="eye" type="button" aria-label="显示或隐藏访问码">👁️</button>
      </div>

      <button class="btn-login" id="btn">进 入 系 统</button>
      <div class="error" id="err">访问码不对，再试一次</div>
    </div>

    <div class="foot">
      本软件完全免费 · 任何收费渠道均非官方<br>
      作者 <a href="https://space.bilibili.com/662538781" target="_blank" rel="noopener">bilibili@雾之韵8296</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const pwdInput = document.getElementById('pwd');
    const eyeBtn = document.getElementById('eye');
    const loginBtn = document.getElementById('btn');
    const errEl = document.getElementById('err');
    const hintEl = document.getElementById('hint');
    const cardEl = document.getElementById('card');
    const toastEl = document.getElementById('toast');

    // 提示语（和后台共用同一个 localStorage 键）
    hintEl.textContent = '💡 ' + (localStorage.getItem('admin_hint') || '远程访问码在本机「防火墙」页面设置');

    // 已登录直接进后台
    if (sessionStorage.getItem('admin_auth') === 'true') {
      location.replace('/admin.html');
    }

    let toastTimer = null;
    const showToast = (text) => {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
    };

    // 显示/隐藏密码
    eyeBtn.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      eyeBtn.textContent = show ? '🙈' : '👁️';
      pwdInput.focus();
    });

    const fail = (msg) => {
      errEl.textContent = msg || '访问码不对，再试一次';
      pwdInput.classList.add('err');
      cardEl.classList.add('shake');
      pwdInput.value = '';
      if (navigator.vibrate) navigator.vibrate(60);
      setTimeout(() => {
        cardEl.classList.remove('shake');
        pwdInput.classList.remove('err');
      }, 400);
      setTimeout(() => { errEl.classList.remove('show'); }, 2400);
      pwdInput.focus();
    };

    const doLogin = async () => {
      const input = pwdInput.value.trim();
      if (!input) { pwdInput.focus(); return; }

      loginBtn.disabled = true;
      loginBtn.textContent = '验证中…';

      try {
        // 远程访问：交给服务端校验
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: input })
        });

        if (res.ok) {
          sessionStorage.setItem('admin_auth', 'true');
          loginBtn.textContent = '进入中…';
          showToast('✅ 验证通过');
          setTimeout(() => { location.href = '/admin.html'; }, 300);
          return;
        }

        const data = await res.json().catch(() => ({}));
        loginBtn.disabled = false;
        loginBtn.textContent = '进 入 系 统';
        fail(data.error);
        return;
      } catch (e) {
        // 接口不可用（旧后端 / 仅本机模式）→ 退回本地校验
        const currentPwd = localStorage.getItem('admin_pwd') || '123456';
        if (input === currentPwd) {
          sessionStorage.setItem('admin_auth', 'true');
          loginBtn.textContent = '进入中…';
          showToast('✅ 验证通过');
          setTimeout(() => { location.href = '/admin.html'; }, 300);
          return;
        }
        loginBtn.disabled = false;
        loginBtn.textContent = '进 入 系 统';
        fail();
      }
    };

    loginBtn.addEventListener('click', doLogin);
    pwdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
    });

    // 进页面自动聚焦（部分手机不允许自动弹键盘，点一下输入框即可）
    window.addEventListener('load', () => {
      setTimeout(() => { pwdInput.focus(); }, 250);
    });
  </script>
</body>
</html>
