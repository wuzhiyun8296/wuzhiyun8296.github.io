<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="mobile" content="ready">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界观树插件</title>
  <script src="/libs/vue/vue.global.prod.js"></script>
  <style>
    /* ---------- 全局暗色细滚动条 ---------- */
    * { scrollbar-width: thin; scrollbar-color: #3c3c3c transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #3c3c3c; border-radius: 8px;
      border: 2px solid transparent; background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: #4e4e4e; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:active { background: #5c5c5c; background-clip: content-box; }
    ::-webkit-scrollbar-corner { background: transparent; }

    * { box-sizing: border-box; }
    body { margin: 0; background: #1e1e1e; color: #ccc; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; padding: 20px 40px; }
    .panel-inner { max-width: 1000px; margin: 0 auto; width: 100%; }

    button { background: #0e639c; color: #fff; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 12px; font-weight: bold; transition: background .2s; white-space: nowrap; }
    button:hover { background: #1177bb; }
    button.secondary { background: #3a3a3a; }
    button.secondary:hover { background: #484848; }
    button.success { background: #2ea043; }
    button.success:hover { background: #3fb950; }

    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 20px; }
    .head h2 { color: #fff; margin: 0 0 6px; font-size: 22px; }
    .head p { color: #888; margin: 0; font-size: 13px; line-height: 1.8; }
    .sync-time { color: #4a8fb5; margin-left: 8px; }

    /* 树节点 */
    .tree-node { margin-left: 18px; border-left: 1px dashed #3a3a3a; padding-left: 14px; margin-top: 8px; }
    .panel-inner > .tree-node { margin-left: 0; border-left: none; padding-left: 0; }
    .node-header { display: flex; align-items: center; justify-content: space-between; background: #252526; padding: 9px 14px; border-radius: 7px; border: 1px solid #333; transition: border-color .15s, background .15s; cursor: pointer; user-select: none; }
    .node-header:hover { border-color: #4a4a4a; background: #2b2b2c; }
    .node-title { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #fff; font-size: 14.5px; }
    .node-count { font-size: 11px; color: #777; font-weight: normal; }
    .caret { display: inline-flex; align-items: center; justify-content: center; width: 16px; color: #8ab4d8; font-size: 10px; transition: transform .15s; }
    .caret.collapsed { transform: rotate(-90deg); }
    .children-box { overflow: hidden; }
    .empty-tip { margin: 8px 0 8px 22px; font-size: 12px; color: #666; }

    /* 文件节点 */
    .file-header { background: #202020; border-left: 3px solid #0e639c; cursor: default; }
    .file-header:hover { background: #202020; border-color: #333; border-left-color: #0e639c; }
    .file-tag { font-size: 11.5px; color: #7d7d7d; font-weight: normal; margin-left: 6px; }

    /* ===== 图标选择器 ===== */
    .icon-box { position: relative; display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn {
      width: 30px; height: 28px; padding: 0; background: transparent; border: 1px dashed transparent;
      border-radius: 6px; font-size: 17px; line-height: 1; cursor: pointer; transition: background .15s, border-color .15s;
    }
    .icon-btn:hover, .icon-box.open .icon-btn { background: #1a1a1a; border-color: #d29922; box-shadow: 0 0 0 2px rgba(210,153,34,.15); }

    .icon-pop {
      position: fixed; z-index: 99999; width: 300px; max-height: 340px; overflow-y: auto;
      background: #24242a; border: 1px solid #43434b; border-radius: 10px;
      box-shadow: 0 18px 44px rgba(0,0,0,.6); padding: 10px 12px 12px;
    }
    .icon-pop::-webkit-scrollbar { width: 8px; }
    .icon-pop::-webkit-scrollbar-thumb { background: #44444c; border-radius: 4px; }
    .icon-group + .icon-group { margin-top: 8px; padding-top: 8px; border-top: 1px solid #33333a; }
    .icon-group-title { font-size: 11px; color: #6f6f7a; margin-bottom: 6px; letter-spacing: 1px; }
    .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
    .icon-item {
      width: 100%; aspect-ratio: 1 / 1; padding: 0; background: #2c2c33; border: 1px solid transparent;
      border-radius: 7px; font-size: 18px; line-height: 1; cursor: pointer; transition: all .12s;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-item:hover { background: #3a3a44; border-color: #5b5b68; transform: translateY(-1px); }
    .icon-item.on { background: #0e639c; border-color: #4aa3df; box-shadow: 0 0 0 2px rgba(14,99,156,.3); }
  
    /* ---------- 📱 手机适配 ---------- */
    @media (max-width: 760px) {
      body { padding: 10px !important; }
      h2, h3 { font-size: 15px !important; }
      .btn, button { min-height: 40px; padding: 9px 14px; font-size: 13px; }
      input, textarea, select { font-size: 15px !important; }
      table { display: block; overflow-x: auto; white-space: nowrap; }
      .toolbar, .chips, .actions { flex-wrap: wrap; }
      canvas { max-width: 100% !important; height: auto !important; }
      .modal-box { width: 92vw !important; max-width: 92vw !important; }
    }
</style>
</head>
<body>
  <div id="app">
    <div class="panel-inner">
      <div class="head">
        <div>
          <h2>🌍 世界观结构树</h2>
          <p>
            结构与物理目录自动保持一致 —— <b style="color:#8ab4d8">增删文件请去「文章编辑」</b>，这里只能改图标：
            <b style="color:#d29922">💡 提示：点击图标可选择图标</b>
            <span class="sync-time" v-if="lastSync">· 已同步 {{ lastSync }}</span>
          </p>
        </div>
        <div style="display:flex; gap:10px; flex-shrink:0;">
          <button class="secondary" @click="expandAllNodes(true)">⊞ 全部展开</button>
          <button class="secondary" @click="expandAllNodes(false)">⊟ 全部收起</button>
          <button class="secondary" @click="syncTree">🔄 一键同步物理目录</button>
          <button class="success" @click="saveTree">💾 保存世界观树</button>
        </div>
      </div>

      <div v-if="treeData.length === 0" style="text-align:center; padding: 50px; color:#666;">
        还没有任何分类。请到「文章编辑」里新建文件夹，这里会自动同步过来。
      </div>

      <tree-node
        v-for="(node, index) in treeData"
        :key="index"
        :node="node"
        :parent-path="''"
      ></tree-node>
    </div>
  </div>

  <script>
    const { createApp, ref, onMounted, inject, provide, watch, reactive } = Vue;
    const API_BASE = '/api';

    // 图标分组（点击图标后弹出的面板）
    const ICON_GROUPS = [
      { name: '分类', icons: [['📁', '默认'], ['🏰', '国家 / 城堡'], ['🌍', '世界'], ['🗺️', '地理 / 区域'], ['🏛️', '制度 / 组织'], ['👑', '王权 / 皇室']] },
      { name: '内容', icons: [['📖', '设定 / 典籍'], ['📜', '历史 / 文献'], ['👤', '人物'], ['🧝‍♂️', '种族'], ['🐉', '魔物'], ['🏙️', '城市']] },
      { name: '力量', icons: [['✨', '魔法'], ['🔮', '神秘 / 预言'], ['🧪', '炼金'], ['⚙️', '技术 / 机械']] },
      { name: '军事', icons: [['⚔️', '战争'], ['🛡️', '骑士 / 防具'], ['🗡️', '武器'], ['🏕️', '营地 / 据点']] },
      { name: '自然', icons: [['🌲', '森林 / 生态'], ['⛰️', '山脉 / 矿脉'], ['🌊', '海洋 / 水域'], ['🌙', '夜晚 / 月相']] },
      { name: '其他', icons: [['💰', '经济 / 商会'], ['📦', '物资 / 仓储'], ['🧭', '导航 / 索引'], ['⛪', '教会 / 信仰'], ['🕯️', '仪式 / 遗迹']] }
    ];

    const TreeNode = {
      name: 'TreeNode',
      props: ['node', 'parentPath'],
      template: `
        <div class="tree-node" v-if="node.type === 'folder'">
          <div class="node-header" @click="collapsed = !collapsed">
            <div class="node-title">
              <span class="caret" :class="{ collapsed: collapsed }">▼</span>
              <span class="icon-box" :class="{ open: pickOpen }">
                <button type="button" class="icon-btn" @click.stop="togglePick($event)" title="点击选择图标">{{ node.icon || '📁' }}</button>
                <Teleport to="body">
                  <div v-if="pickOpen" class="icon-pop" :style="popStyle" @click.stop>
                    <div v-for="g in iconGroups" :key="g.name" class="icon-group">
                      <div class="icon-group-title">{{ g.name }}</div>
                      <div class="icon-grid">
                        <button type="button" v-for="ic in g.icons" :key="ic[0]" class="icon-item"
                                :class="{ on: node.icon === ic[0] }" :title="ic[1]" @click="pick(ic[0])">{{ ic[0] }}</button>
                      </div>
                    </div>
                  </div>
                </Teleport>
              </span>
              {{ node.name }}
              <span class="node-count" v-if="node.children && node.children.length">({{ node.children.length }})</span>
            </div>
          </div>

          <div class="children-box" v-show="!collapsed">
            <div v-if="node.children && node.children.length > 0">
              <tree-node
                v-for="(child, index) in node.children"
                :key="index"
                :node="child"
                :parent-path="parentPath ? parentPath + '/' + node.name : node.name"
              ></tree-node>
            </div>
            <div v-else class="empty-tip">（空分类，去「文章编辑」里加文件）</div>
          </div>
        </div>

        <div v-else class="tree-node">
          <div class="node-header file-header">
            <div class="node-title" style="font-weight: normal;">
              📄 {{ node.name }}
              <span class="file-tag">{{ node.slug }}</span>
            </div>
          </div>
        </div>
      `,
      setup(props) {
        const collapsed = ref(true);
        const iconGroups = ICON_GROUPS;

        // ==== 图标选择面板 ====
        const pickOpen = ref(false);
        const popStyle = ref({});
        const POP_W = 300;

        const closePop = () => { pickOpen.value = false; };

        const togglePick = (ev) => {
          if (pickOpen.value) { closePop(); return; }
          const r = ev.currentTarget.getBoundingClientRect();
          const left = Math.min(r.left - 6, window.innerWidth - POP_W - 12);
          const spaceBelow = window.innerHeight - r.bottom;
          const popH = 340;
          const top = spaceBelow < popH + 20 ? Math.max(10, r.top - popH - 8) : r.bottom + 6;
          popStyle.value = { left: Math.max(10, left) + 'px', top: top + 'px' };
          pickOpen.value = true;
          setTimeout(() => document.addEventListener('click', closePop, { once: true }), 0);
        };

        const pick = (icon) => {
          props.node.icon = icon;
          closePop();
        };

        // 全局「全部展开 / 全部收起」
        const expandBus = inject('expandBus', null);
        if (expandBus) {
          watch(() => expandBus.tick, () => { collapsed.value = !expandBus.expand; });
        }

        return { collapsed, iconGroups, pickOpen, popStyle, togglePick, pick };
      }
    };

    const app = createApp({
      setup() {
        const treeData = ref([]);
        const lastSync = ref('');
        const expandBus = reactive({ tick: 0, expand: true });
        provide('expandBus', expandBus);

        const expandAllNodes = (v) => { expandBus.expand = v; expandBus.tick++; };

        const showToast = (msg, isError = false) => {
          const old = document.getElementById('custom-toast');
          if (old) old.remove();
          const t = document.createElement('div');
          t.id = 'custom-toast';
          t.innerText = msg;
          t.style = `position:fixed; bottom:30px; right:30px; background:${isError ? '#a82626' : '#2ea043'}; color:#fff; padding:12px 22px; border-radius:6px; z-index:999999; transition: all .3s; box-shadow: 0 4px 15px rgba(0,0,0,.45); font-weight: bold; font-size:13px; transform: translateY(16px); opacity: 0;`;
          document.body.appendChild(t);
          setTimeout(() => { t.style.opacity = '1'; t.style.transform = 'translateY(0)'; }, 10);
          setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(16px)'; setTimeout(() => t.remove(), 300); }, 2400);
        };

        const fetchTree = async () => {
          try {
            const res = await fetch(`${API_BASE}/world-tree?t=${Date.now()}`);
            treeData.value = await res.json();
          } catch (e) { showToast('读取失败', true); }
        };

        // silent=true：自动同步，没变化不提示
        const doSync = async (silent) => {
          try {
            if (!silent) showToast('⏳ 正在扫描并同步...');
            const res = await fetch(`${API_BASE}/sync-tree`, { method: 'POST' });
            const data = await res.json();
            if (!data.success) return;
            treeData.value = data.treeData;
            lastSync.value = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const a = data.addedCount || 0, r = data.removedCount || 0;
            if (silent && !a && !r) return;
            showToast(`✅ 同步完成：新增 ${a} 个，移除 ${r} 个失效条目`);
          } catch (e) { if (!silent) showToast('同步失败', true); }
        };

        const syncTree = async () => {
          if (!confirm('将扫描物理目录：补全缺失的条目，并移除「文件已被删除」的条目（只动目录树，不删文件）。是否继续？')) return;
          await doSync(false);
        };

        const saveTree = async () => {
          try {
            await fetch(`${API_BASE}/world-tree`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(treeData.value)
            });
            showToast('✅ 世界观树已保存（图标等展示设置）');
          } catch (e) { showToast('保存失败', true); }
        };

        onMounted(async () => {
          await fetchTree();
          doSync(true);
          window.addEventListener('focus', () => doSync(true));
          document.addEventListener('visibilitychange', () => { if (!document.hidden) doSync(true); });
          setInterval(() => { if (!document.hidden) doSync(true); }, 15000);

          // 调试用：?pick=1 打开页面时自动展开第一个图标面板
          try {
            if (new URLSearchParams(location.search).get('pick') === '1') {
              setTimeout(() => { const b = document.querySelector('.icon-btn'); if (b) b.click(); }, 700);
            }
          } catch (e) {}
        });

        return { treeData, lastSync, expandAllNodes, syncTree, saveTree };
      }
    });

    app.component('tree-node', TreeNode);
    app.mount('#app');
  </script>
</body>
</html>
