<!-- 文件路径: plugin/plotline.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>剧情线管理</title>
  <script src="/libs/vue/vue.global.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; background: #1e1e1e; color: #ccc; display: flex; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
    #app { display: flex; width: 100%; height: 100%; }
    
    /* 左侧：卷列表 */
    .sidebar { width: 260px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; background: #2d2d2d; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;}
    .sidebar-header h2 { margin: 0; color: #fff; font-size: 16px; }
    .vol-list { flex: 1; overflow-y: auto; padding: 10px; }
    
    .vol-item { 
      padding: 10px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 5px; 
      transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; 
      border: 1px solid transparent; overflow: hidden; 
    }
    .vol-item:hover { background: #2d2d2d; }
    .vol-item.active { background: rgba(14, 99, 156, 0.2); border-color: #0e639c; color: #fff; }
    
    .vol-title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; user-select: none; }
    .vol-title-input { background: #121212; border: 1px solid #0e639c; color: #fff; padding: 2px 5px; border-radius: 4px; font-size: 14px; width: 100%; outline: none; }
    
    .vol-item .delete-vol { display: none; color: #a82626; font-size: 12px; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
    .vol-item:hover .delete-vol { display: block; }
    .vol-item .delete-vol:hover { background: #a82626; color: #fff; }

    /* 右侧：章节看板 */
    .main-area { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; }
    .toolbar { padding: 15px 20px; background: #2d2d2d; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    
    /* 顶部卷名修改输入框 */
    .top-vol-input { 
      background: transparent; border: 1px solid transparent; border-bottom: 1px dashed #666; 
      color: #fff; font-size: 18px; font-weight: bold; outline: none; padding: 2px 5px; 
      width: 300px; transition: all 0.2s; font-family: inherit;
    }
    .top-vol-input:hover, .top-vol-input:focus { border-bottom-color: #0e639c; background: rgba(14, 99, 156, 0.1); border-radius: 4px 4px 0 0; }
    
    .btn { background: #0e639c; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
    .btn:hover { background: #1177bb; }
    .btn-success { background: #2ea043; }
    .btn-success:hover { background: #3fb950; }
    .btn-outline { background: transparent; border: 1px solid #444; color: #ccc; }
    .btn-outline:hover { background: #333; color: #fff; }

    .chapters-container { flex: 1; overflow-y: auto; padding: 20px; }
    
    /* 章节卡片 */
    .chapter-card { 
      background: #252526; border: 1px solid #444; border-radius: 8px; padding: 15px; margin-bottom: 15px; 
      cursor: grab; transition: border-color 0.2s, background 0.2s, transform 0.1s;
      position: relative; display: flex; flex-direction: column; gap: 10px;
    }
    .chapter-card:hover { border-color: #0e639c; }
    .chapter-card:active { cursor: grabbing; }
    .chapter-card.dragging { opacity: 0.4; border: 1px dashed #0e639c; background: #1a1a1a; }
    .chapter-card.drag-over { border-top: 3px solid #0e639c; margin-top: -3px; }

    .card-header { display: flex; gap: 10px; align-items: center; }
    .chapter-title-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 16px; font-weight: bold; outline: none; padding: 4px; border-radius: 4px; transition: background 0.2s;}
    .chapter-title-input:focus { background: #121212; }
    
    .chapter-desc-input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #aaa; font-size: 13px; padding: 10px; border-radius: 4px; outline: none; resize: vertical; min-height: 60px; line-height: 1.5; font-family: inherit;}
    .chapter-desc-input:focus { border-color: #0e639c; color: #fff; }

    .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 5px;}
    .move-select { background: #121212; border: 1px solid #444; color: #aaa; padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none; cursor: pointer; }
    .delete-btn { background: transparent; border: none; color: #a82626; cursor: pointer; font-size: 13px; padding: 4px 8px; border-radius: 4px; }
    .delete-btn:hover { background: rgba(168, 38, 38, 0.2); }

    .empty-tip { text-align: center; color: #666; margin-top: 50px; font-size: 15px; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 左侧：卷分类 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>📚 分卷大纲</h2>
        <button class="btn btn-outline" @click="addVolume" style="padding: 4px 8px;">+ 新建卷</button>
      </div>
      <div class="vol-list">
        <div 
          v-for="(vol, index) in data" 
          :key="vol.id" 
          class="vol-item" 
          :class="{ active: currentVolIndex === index }"
          @click="currentVolIndex = index"
        >
          <!-- 💡 双击文字进入编辑模式 -->
          <span 
            v-if="editingVolIndex !== index" 
            class="vol-title-text" 
            @dblclick.stop="startEditVol(index)"
            title="双击修改名称"
          >
            {{ vol.title }}
          </span>
          <!-- 💡 编辑模式的输入框 -->
          <input 
            v-else 
            type="text" 
            class="vol-title-input"
            v-model="vol.title" 
            @blur="editingVolIndex = null" 
            @keyup.enter="editingVolIndex = null"
            v-focus
          />

          <span class="delete-vol" @click.stop="deleteVolume(index)">✖</span>
        </div>
      </div>
    </div>

    <!-- 右侧：章节管理 -->
    <div class="main-area">
      <div class="toolbar">
        <div v-if="currentVol" style="display: flex; align-items: center; gap: 10px;">
          <span style="color: #888; font-size: 16px;">正在编辑：</span>
          <!-- 💡 顶部直接修改卷名 -->
          <input 
            type="text" 
            class="top-vol-input" 
            v-model="currentVol.title" 
            title="在此处直接修改卷名"
          />
        </div>
        <h1 v-else style="margin:0; font-size: 18px; color: #fff;">暂无卷轴</h1>

        <div style="display: flex; gap: 10px;">
          <button class="btn btn-success" @click="saveData">💾 保存大纲</button>
          <button class="btn" @click="addChapter" v-if="currentVol">+ 添加章节</button>
        </div>
      </div>

      <div class="chapters-container" v-if="currentVol">
        <div v-if="currentVol.chapters.length === 0" class="empty-tip">
          本卷还没有章节，点击右上角添加。
        </div>

        <div 
          v-for="(chapter, index) in currentVol.chapters" 
          :key="chapter.id"
          class="chapter-card"
          :class="{ dragging: dragIndex === index, 'drag-over': dragOverIndex === index }"
          draggable="true"
          @dragstart="handleDragStart($event, index)"
          @dragover.prevent="handleDragOver(index)"
          @dragleave="handleDragLeave"
          @drop="handleDrop(index)"
          @dragend="handleDragEnd"
        >
          <div class="card-header">
            <span style="color: #666; cursor: grab;">⋮⋮</span>
            <input type="text" class="chapter-title-input" v-model="chapter.title" placeholder="章节标题" />
          </div>
          
          <textarea class="chapter-desc-input" v-model="chapter.desc" placeholder="填写本章的剧情梗概..."></textarea>
          
          <div class="card-actions">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 12px; color: #666;">移动到:</span>
              <select class="move-select" @change="moveChapterToVol(index, $event.target.value)">
                <option value="" disabled selected>选择卷...</option>
                <option v-for="(v, vIdx) in data" :key="v.id" :value="vIdx" :disabled="vIdx === currentVolIndex">
                  {{ v.title }}
                </option>
              </select>
            </div>
            <button class="delete-btn" @click="deleteChapter(index)">🗑️ 删除本章</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, onMounted, nextTick } = Vue;
    const API_BASE = 'http://localhost:3001/api';

    createApp({
      setup() {
        const data = ref([]);
        const currentVolIndex = ref(0);
        const editingVolIndex = ref(null); // 记录当前哪个卷在编辑状态

        const currentVol = computed(() => data.value[currentVolIndex.value] || null);

        // 自定义指令：让输入框自动聚焦
        const vFocus = {
          mounted: (el) => {
            el.focus();
            el.select(); // 自动全选文字，方便直接覆盖输入
          }
        };

        const startEditVol = (index) => {
          editingVolIndex.value = index;
        };

        // ========== 拖拽逻辑 ==========
        const dragIndex = ref(null);
        const dragOverIndex = ref(null);

        const handleDragStart = (e, index) => {
          dragIndex.value = index;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', index);
        };

        const handleDragOver = (index) => {
          if (dragIndex.value === null || dragIndex.value === index) return;
          dragOverIndex.value = index;
        };

        const handleDragLeave = () => {
          dragOverIndex.value = null;
        };

        const handleDrop = (dropIndex) => {
          if (dragIndex.value === null || dragIndex.value === dropIndex) return;
          const chapters = currentVol.value.chapters;
          const [draggedItem] = chapters.splice(dragIndex.value, 1);
          chapters.splice(dropIndex, 0, draggedItem);
          dragIndex.value = null;
          dragOverIndex.value = null;
        };

        const handleDragEnd = () => {
          dragIndex.value = null;
          dragOverIndex.value = null;
        };

        // ========== 增删改操作 ==========
        const addVolume = () => {
          const volName = prompt('请输入新卷的名称：', `第${data.value.length + 1}卷：新篇章`);
          if (!volName) return;
          data.value.push({
            id: 'v_' + Date.now(),
            title: volName,
            chapters: []
          });
          currentVolIndex.value = data.value.length - 1;
        };

        const deleteVolume = (index) => {
          if (confirm(`确认删除 [${data.value[index].title}] 及其所有章节吗？`)) {
            data.value.splice(index, 1);
            if (currentVolIndex.value >= data.value.length) {
              currentVolIndex.value = Math.max(0, data.value.length - 1);
            }
          }
        };

        const addChapter = () => {
          currentVol.value.chapters.push({
            id: 'c_' + Date.now(),
            title: `第${currentVol.value.chapters.length + 1}章：未命名`,
            desc: ''
          });
        };

        const deleteChapter = (index) => {
          if (confirm('确认删除该章节吗？')) {
            currentVol.value.chapters.splice(index, 1);
          }
        };

        const moveChapterToVol = (chapterIndex, targetVolIndex) => {
          const chapter = currentVol.value.chapters.splice(chapterIndex, 1)[0];
          data.value[targetVolIndex].chapters.push(chapter);
          showToast('已移动到指定卷');
        };

        // ========== 数据加载与保存 ==========
        const loadData = async () => {
          try {
            const res = await fetch(`${API_BASE}/plotline?t=${Date.now()}`);
            data.value = await res.json();
          } catch (e) {
            showToast('加载大纲失败', true);
          }
        };

        const saveData = async () => {
          try {
            await fetch(`${API_BASE}/plotline`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data.value)
            });
            showToast('✅ 大纲保存成功');
          } catch (e) {
            showToast('保存失败', true);
          }
        };

        const showToast = (msg, isError = false) => {
          const oldToast = document.getElementById('custom-toast'); if (oldToast) oldToast.remove();
          const toast = document.createElement('div'); toast.id = 'custom-toast'; toast.innerText = msg;
          toast.style = `position:fixed; bottom:30px; right:30px; background:${isError ? '#a82626' : '#2ea043'}; color:#fff; padding:12px 24px; border-radius:6px; z-index:99999; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-weight: bold;`;
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 2500);
        };

        onMounted(loadData);

        return { 
          data, currentVolIndex, currentVol, editingVolIndex, startEditVol, vFocus,
          dragIndex, dragOverIndex,
          handleDragStart, handleDragOver, handleDragLeave, handleDrop, handleDragEnd,
          addVolume, deleteVolume, addChapter, deleteChapter, moveChapterToVol,
          saveData
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
