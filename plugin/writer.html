<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>沉浸写书</title>
  <script src="/libs/vue/vue.global.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #bbb; font-family: 'Microsoft YaHei', sans-serif; height: 100vh; display: flex; overflow: hidden; }
    
    #app { display: flex; flex-direction: column; width: 100%; height: 100%; }

    /* 顶部全局导航 */
    .global-header { height: 50px; background: #1e1e1e; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; flex-shrink: 0; }
    .breadcrumb { display: flex; gap: 10px; align-items: center; font-size: 16px; }
    .breadcrumb span { cursor: pointer; color: #888; transition: color 0.2s;}
    .breadcrumb span:hover { color: #fff; }
    .breadcrumb span.active { color: #d29922; font-weight: bold; cursor: default; }
    
    /* 视图容器 */
    .view-container { flex: 1; overflow-y: auto; position: relative; }

    /* ============ 视图 1：书架 ============ */
    .shelf-view { padding: 40px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .book-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 20px; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 220px; position: relative; cursor: pointer; }
    .book-card:hover { background: #252526; border-color: #0e639c; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    .book-icon { font-size: 50px; margin-bottom: 15px; }
    .book-title { font-size: 18px; font-weight: bold; color: #fff; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
    .book-count { font-size: 12px; color: #666; margin-top: 10px; }
    
    .book-actions { position: absolute; top: 10px; right: 10px; opacity: 0; transition: opacity 0.2s; display: flex; gap: 5px; }
    .book-card:hover .book-actions { opacity: 1; }

    .btn-add-book { background: transparent; border: 2px dashed #444; color: #666; border-radius: 8px; height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 16px;}
    .btn-add-book:hover { border-color: #0e639c; color: #0e639c; background: rgba(14, 99, 156, 0.1); }

    /* ============ 视图 2：章节目录 ============ */
    .chapters-view { padding: 40px; max-width: 800px; margin: 0 auto; }
    .chapter-list { display: flex; flex-direction: column; gap: 10px; }
    .chapter-item { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
    .chapter-item:hover { background: #252526; border-color: #444; }
    .chapter-title { font-size: 16px; color: #ddd; }
    .chapter-actions { display: flex; gap: 10px; opacity: 0; transition: opacity 0.2s; }
    .chapter-item:hover .chapter-actions { opacity: 1; }

    /* ============ 视图 3：沉浸码字 ============ */
    .editor-view { flex: 1; display: flex; flex-direction: column; height: 100%; background: #121212; }
    
    /* 💡 富文本工具栏 */
    .format-toolbar { 
      height: 40px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; 
      background: #1a1a1a; border-bottom: 1px solid #222; flex-shrink: 0;
    }
    .format-tools-left { display: flex; align-items: center; gap: 5px;}
    .format-tools-right { font-size: 12px; color: #555; display: flex; gap: 15px;}
    
    .format-btn { 
      background: transparent; border: none; color: #888; font-size: 14px; cursor: pointer; 
      padding: 4px 10px; border-radius: 4px; transition: all 0.2s; display: flex; align-items: center; gap: 4px;
    }
    .format-btn:hover { background: #333; color: #fff; }
    
    /* 💡 替换为富文本容器 */
    .editor-container { flex: 1; display: flex; justify-content: center; overflow: hidden; padding: 20px 40px; }
    .rich-editor {
      width: 100%; max-width: 900px; height: 100%; background: transparent; border: none; outline: none; overflow-y: auto;
      color: #ddd; font-size: 18px; line-height: 2; padding: 10px 20px;
      font-family: 'Microsoft YaHei', sans-serif; letter-spacing: 0.5px;
      white-space: pre-wrap; 
    }
    .rich-editor::-webkit-scrollbar { width: 8px; }
    .rich-editor::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    /* 💡 占位符提示 */
    .rich-editor:empty:before { content: attr(placeholder); color: #555; pointer-events: none; display: block; line-height: 1.5; }

    /* 进度条 */
    .progress-container { width: 100px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 10px;}
    .progress-bar { height: 100%; background: #2ea043; transition: width 0.3s; }

    /* 按钮通用 */
    button { background: #0e639c; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 5px; transition: background 0.2s;}
    button:hover { background: #1177bb; }
    button.secondary { background: #333; }
    button.secondary:hover { background: #444; }
    button.danger { background: #a82626; }
    button.danger:hover { background: #c92a2a; }
    button.success { background: #2ea043; }
    button.success:hover { background: #3fb950; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 顶部导航 -->
    <div class="global-header">
      <div class="breadcrumb">
        <span :class="{ active: viewMode === 'shelf' }" @click="goToShelf">📚 我的书架</span>
        <template v-if="currentBook">
          <span>/</span>
          <span :class="{ active: viewMode === 'chapters' }" @click="goToChapters">{{ currentBook.name }}</span>
        </template>
        <template v-if="currentPath && viewMode === 'editor'">
          <span>/</span>
          <span class="active">{{ currentPath.split('/').pop().replace('.md', '') }}</span>
        </template>
      </div>

      <!-- 码字统计与工具栏 -->
      <div style="display: flex; gap: 20px; align-items: center;" v-if="viewMode === 'editor'">
        <div class="stats" style="font-size: 13px;">
          总字数: <span style="color:#fff; font-weight:bold; font-size:15px;">{{ totalWords }}</span>
          <span style="margin-left: 20px;">今日码字: <span style="color:#fff; font-weight:bold; font-size:15px;">{{ todayWords }}</span></span>
          <div class="progress-container" title="每日目标 2000 字">
            <div class="progress-bar" :style="{ width: Math.min(todayWords / 2000 * 100, 100) + '%' }"></div>
          </div>
        </div>
        <button class="secondary" @click="toggleFocus" title="进入沉浸模式，隐藏所有干扰 (Ctrl+Shift+F)">
          {{ isFocus ? '🔍 退出沉浸 (Ctrl+Shift+F)' : '👁️ 沉浸模式 (Ctrl+Shift+F)' }}
        </button>
        <button class="success" @click="saveFile" :disabled="!currentPath" title="保存当前章节 (Ctrl+S)">💾 保存 (Ctrl+S)</button>
      </div>
    </div>

    <!-- 主视图区域 -->
    <div class="view-container">
      
      <!-- ================= 视图 1：书架 ================= -->
      <div class="shelf-view" v-if="viewMode === 'shelf'">
        <div class="book-card" v-for="(book, idx) in books" :key="idx" @click="openBook(book)">
          <div class="book-actions">
            <button class="secondary" @click.stop="renameBook(book)" title="重命名这本书">✏️ 改名</button>
          </div>
          <div class="book-icon">📕</div>
          <div class="book-title">{{ book.name }}</div>
          <div class="book-count">{{ book.children ? book.children.length : 0 }} 章</div>
        </div>
        <div class="btn-add-book" @click="createBook" title="在 library 文件夹下新建一本书">
          <div style="font-size: 40px; margin-bottom: 10px;">+</div>
          <div>创建新书</div>
        </div>
      </div>

      <!-- ================= 视图 2：章节目录 ================= -->
      <div class="chapters-view" v-if="viewMode === 'chapters'">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="color: #fff; margin: 0;">《{{ currentBook.name }}》目录</h2>
          <button @click="createChapter" title="为这本书添加一个新章节">+ 新建章节</button>
        </div>
        <div class="chapter-list">
          <div class="chapter-item" v-for="(chapter, idx) in currentBook.children" :key="idx" @click="openChapter(chapter)">
            <div class="chapter-title">📄 {{ chapter.name.replace('.md', '') }}</div>
            <div class="chapter-actions">
              <button class="secondary" @click.stop="renameChapter(chapter)" title="修改章节名称">✏️ 改名</button>
              <button class="danger" @click.stop="deleteChapter(chapter, idx)" title="彻底删除这一章">删除</button>
            </div>
          </div>
          <div v-if="!currentBook.children || currentBook.children.length === 0" style="text-align: center; color: #666; padding: 50px;">
            这本书还没有章节，点击右上角新建吧！
          </div>
        </div>
      </div>

      <!-- ================= 视图 3：沉浸码字 ================= -->
      <div class="editor-view" v-if="viewMode === 'editor'">
        
        <!-- 💡 富文本工具栏 -->
        <div class="format-toolbar" v-if="!isFocus">
          <div class="format-tools-left">
            <button class="format-btn" @click="formatDoc('bold')" title="加粗选中的文字 (Ctrl+B)"><b>B</b> 粗体</button>
            <button class="format-btn" @click="formatDoc('italic')" title="斜体选中的文字，常用于内心独白 (Ctrl+I)"><i>I</i> 斜体</button>
            <button class="format-btn" @click="formatDoc('underline')" title="给选中的文字加下划线 (Ctrl+U)"><u>U</u> 下划线</button>
            <div style="width: 1px; height: 16px; background: #444; margin: 0 5px;"></div>
            <button class="format-btn" @click="formatDoc('justifyLeft')" title="段落靠左对齐">⯇ 左对齐</button>
            <button class="format-btn" @click="formatDoc('justifyCenter')" title="将选中的文字居中显示">≡ 居中</button>
            <button class="format-btn" @click="formatDoc('insertHorizontalRule')" title="插入一条场景分割线">— 分割线</button>
            <button class="format-btn" @click="autoIndent" title="为所有未缩进的段落自动加上两个全角空格">⇥ 首行缩进</button>
          </div>
          
          <!-- 💡 快捷键常驻小提示 -->
          <div class="format-tools-right">
            <span title="打字时按回车会自动空两格">💡 回车自动缩进</span>
            <span title="复制的内容会保留段落并自动缩进">📋 粘贴自动排版</span>
            <span title="保存后 VitePress 网页会自动更新">🌐 同步至网站</span>
          </div>
        </div>

        <div class="editor-container">
          <!-- 💡 替换为 contenteditable 富文本容器 -->
          <div 
            v-if="currentPath"
            id="novel-editor"
            class="rich-editor"
            contenteditable="true"
            placeholder="落笔即成史... (温馨提示：如果你想加粗或居中，请先用鼠标选中文字，再点击上方的按钮)"
            @input="onRichInput"
            @keydown="handleRichKeyDown"
            @paste="handlePaste"
          ></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue;
    const API_BASE = 'http://localhost:3001/api';

    createApp({
      setup() {
        const viewMode = ref('shelf'); 
        const libraryTree = ref([]);
        const currentBook = ref(null);
        const currentPath = ref('');
        const content = ref(''); 
        
        const isFocus = ref(false);
        
        const totalWords = computed(() => {
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = content.value;
          const text = (tempDiv.textContent || tempDiv.innerText || '').replace(/[\s\n\r]/g, '');
          return text.length;
        });
        
        const todayWords = ref(0);
        const todayKey = 'writer_daily_count_' + new Date().toISOString().split('T')[0];
        let lastInputLen = 0;
        let autoSaveTimer = null;

        const fetchLibrary = async () => {
          try {
            const res = await fetch(`${API_BASE}/library/tree`);
            libraryTree.value = await res.json();
            return libraryTree.value;
          } catch (e) {
            showToast('获取书库失败', true);
            return [];
          }
        };

        const books = computed(() => {
          return libraryTree.value.filter(item => item.type === 'folder');
        });

        const goToShelf = async () => {
          await fetchLibrary();
          viewMode.value = 'shelf';
          currentBook.value = null;
          currentPath.value = null;
          content.value = '';
        };

        const openBook = (book) => {
          currentBook.value = book;
          viewMode.value = 'chapters';
        };

        const goToChapters = () => {
          if (currentBook.value) {
            viewMode.value = 'chapters';
            currentPath.value = null;
            content.value = '';
          }
        };

        const createBook = async () => {
          const name = prompt('请输入新书名称 (例如: 星落之城):');
          if (!name) return;
          const path = `${name}/目录.md`;
          try {
            await fetch(`${API_BASE}/library/file`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ path, content: '' })
            });
            showToast('✅ 书籍创建成功');
            goToShelf();
          } catch (e) { showToast('创建失败', true); }
        };

        const renameBook = async (book) => {
          const newName = prompt('请输入新的书名:', book.name);
          if (!newName || newName === book.name) return;
          try {
            const res = await fetch(`${API_BASE}/library/rename`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ oldPath: book.name, newName: newName })
            });
            const data = await res.json();
            if(data.success) {
              showToast('✅ 书名修改成功');
              goToShelf();
            } else { showToast(data.error, true); }
          } catch(e) { showToast('重命名失败', true); }
        };

        const createChapter = async () => {
          if (!currentBook.value) return;
          const name = prompt('输入章节名称 (例如: 第一章 穿越):');
          if (!name) return;
          const path = `${currentBook.value.name}/${name}.md`;
          try {
            await fetch(`${API_BASE}/library/file`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ path, content: '<div><br></div>' })
            });
            showToast('✅ 章节已创建');
            const tree = await fetchLibrary();
            currentBook.value = tree.find(b => b.name === currentBook.value.name);
          } catch (e) { showToast('创建失败', true); }
        };

        const renameChapter = async (chapter) => {
          const oldName = chapter.name.replace('.md', '');
          const newName = prompt('请输入新的章节名:', oldName);
          if (!newName || newName === oldName) return;
          try {
            const res = await fetch(`${API_BASE}/library/rename`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ oldPath: chapter.path, newName: newName })
            });
            const data = await res.json();
            if(data.success) {
              showToast('✅ 章节名修改成功');
              const tree = await fetchLibrary();
              currentBook.value = tree.find(b => b.name === currentBook.value.name);
            } else { showToast(data.error, true); }
          } catch(e) { showToast('重命名失败', true); }
        };

        const openChapter = async (chapter) => {
          try {
            const res = await fetch(`${API_BASE}/library/file?path=${encodeURIComponent(chapter.path)}`);
            const data = await res.json();
            content.value = data.content || '<div><br></div>';
            currentPath.value = chapter.path;
            
            await nextTick();
            const editor = document.getElementById('novel-editor');
            if(editor) editor.innerHTML = content.value;
            
            lastInputLen = totalWords.value;
            viewMode.value = 'editor';
          } catch (e) { showToast('读取失败', true); }
        };

        const deleteChapter = async (chapter, index) => {
          if (!confirm(`确定要删除章节《${chapter.name}》吗？无法恢复！`)) return;
          try {
            await fetch(`${API_BASE}/library/delete`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ path: chapter.path })
            });
            currentBook.value.children.splice(index, 1);
            showToast('已删除');
          } catch (e) { showToast('删除失败', true); }
        };

        const onRichInput = (e) => {
           content.value = e.target.innerHTML;
           const currentLen = totalWords.value;
           if (currentLen > lastInputLen) {
              todayWords.value += (currentLen - lastInputLen);
              localStorage.setItem(todayKey, todayWords.value);
           }
           lastInputLen = currentLen;
        };

        const handleRichKeyDown = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            document.execCommand('insertHTML', false, '<br>&#12288;&#12288;');
          }
        };

        const handlePaste = (e) => {
          e.preventDefault();
          const text = e.clipboardData.getData('text/plain');
          const html = text.split('\n').map(line => {
             if(line.trim() === '') return '<div><br></div>';
             return `<div>&#12288;&#12288;${line}</div>`;
          }).join('');
          document.execCommand('insertHTML', false, html);
        };

        const formatDoc = (cmd) => {
          document.execCommand(cmd, false, null);
        };

        const autoIndent = () => {
          const editor = document.getElementById('novel-editor');
          if (!editor) return;
          let html = editor.innerHTML;
          html = html.replace(/<(div|p)([^>]*)>/g, '<$1$2>&#12288;&#12288;');
          html = html.replace(/(&#12288;){2,}/g, '&#12288;&#12288;');
          editor.innerHTML = html;
          content.value = html;
          showToast('已为全文段落添加首行缩进');
        };

        const saveFile = async (isAuto = false) => {
          if (!currentPath.value) return;
          try {
            await fetch(`${API_BASE}/library/file`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ path: currentPath.value, content: content.value })
            });
            if (!isAuto) showToast('✅ 章节已保存');
            else showToast('⏳ 自动保存成功');
          } catch (e) { showToast('保存失败', true); }
        };

        const toggleFocus = () => { isFocus.value = !isFocus.value; };

        const handleGlobalKeydown = (e) => {
          if (e.ctrlKey && e.key === 's') {
            e.preventDefault();
            if (viewMode.value === 'editor') saveFile();
          }
          if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'f') {
            e.preventDefault();
            if (viewMode.value === 'editor') toggleFocus();
          }
        };

        const showToast = (msg, isError = false) => {
          const oldToast = document.getElementById('custom-toast'); if (oldToast) oldToast.remove();
          const toast = document.createElement('div'); toast.id = 'custom-toast'; toast.innerText = msg;
          toast.style = `position:fixed; bottom:30px; right:30px; background:${isError ? '#a82626' : '#2ea043'}; color:#fff; padding:12px 24px; border-radius:6px; z-index:99999; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-weight: bold;`;
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 2500);
        };

        onMounted(async () => {
          const savedCount = localStorage.getItem(todayKey);
          if (savedCount) todayWords.value = parseInt(savedCount);
          await fetchLibrary();
          autoSaveTimer = setInterval(() => {
            if (viewMode.value === 'editor' && currentPath.value && content.value) saveFile(true);
          }, 60000);
          window.addEventListener('keydown', handleGlobalKeydown);
        });

        onUnmounted(() => {
          if (autoSaveTimer) clearInterval(autoSaveTimer);
          window.removeEventListener('keydown', handleGlobalKeydown);
        });

        return {
          viewMode, books, currentBook, currentPath, content, isFocus, totalWords, todayWords,
          goToShelf, openBook, goToChapters, createBook, renameBook, createChapter, renameChapter, openChapter, deleteChapter,
          onRichInput, saveFile, toggleFocus, handleRichKeyDown, handlePaste, formatDoc, autoIndent
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
