<!-- 文件路径: plugin/github.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>一键推送至 GitHub</title>
  <script src="/libs/vue/vue.global.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; background: #1e1e1e; color: #ccc; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; overflow-y: auto; }
    .container { width: 100%; max-width: 900px; padding: 30px 20px; display: flex; flex-direction: column; gap: 20px; }
    /* 💡 关键：flex 子项默认会被压扁（配置面板被挤成 0 高度，展开也看不到内容） */
    .container > * { flex-shrink: 0; }
    
    .header { text-align: center; }
    .header h1 { color: #fff; margin: 0 0 10px 0; font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px;}
    .header p { color: #888; margin: 0; font-size: 14px; }

    .config-panel { background: #252526; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
    .config-header { padding: 15px 20px; background: #2d2d2d; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .config-header h3 { margin: 0; font-size: 16px; color: #fff; display: flex; align-items: center; gap: 8px;}
    .config-header .arrow { transition: transform 0.3s; color: #888; font-size: 12px; }
    .config-header .arrow.open { transform: rotate(180deg); }
    
    .config-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; border-top: 1px solid #333; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full-width { grid-column: span 2; }
    .form-group label { font-size: 13px; color: #aaa; }
    .form-group input { 
      background: #121212; border: 1px solid #444; color: #fff; 
      padding: 10px 12px; border-radius: 4px; outline: none; font-size: 14px; transition: border 0.2s;
    }
    .form-group input:focus { border-color: #0e639c; }
    .form-group .help-text { font-size: 12px; color: #666; margin-top: 2px; }

        .note-field { margin-bottom: 14px; }
    .note-label { display: block; font-size: 13px; color: #9cdcfe; margin-bottom: 6px; }
    .note-field textarea {
      width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 6px;
      background: #1e1e1e; border: 1px solid #444; color: #ddd; font-size: 13px;
      line-height: 1.6; resize: vertical; font-family: inherit;
    }
    .note-field textarea:focus { outline: none; border-color: #0e639c; }
    .note-presets { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .preset-btn {
      background: #2d2d2d; color: #ccc; border: 1px solid #444; border-radius: 6px;
      padding: 6px 12px; font-size: 12px; cursor: pointer; transition: all .15s;
    }
    .preset-btn:hover { border-color: #0e639c; color: #fff; }
    .preset-btn.on { background: #0e639c; border-color: #0e639c; color: #fff; }
    .preset-hint { margin-top: 6px; font-size: 12px; color: #888; }

    .note-count { text-align: right; font-size: 11px; color: #666; margin-top: 4px; }
    .push-form { background: #252526; border: 1px solid #333; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 15px;}
    
    .action-row { display: flex; gap: 15px; }
    .action-row input { 
      flex: 1; background: #121212; border: 1px solid #444; color: #fff; 
      padding: 12px 15px; border-radius: 6px; outline: none; font-size: 15px;
    }
    
    .btn-save { 
      background: #0e639c; color: #fff; border: none; padding: 0 20px; border-radius: 6px; 
      cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; white-space: nowrap;
    }
    .btn-save:hover { background: #1177bb; }
    
    .btn-push { 
      background: #2ea043; color: #fff; border: none; padding: 0 25px; border-radius: 6px; 
      cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .btn-push:hover:not(:disabled) { background: #3fb950; }
    .btn-push:disabled { background: #555; cursor: not-allowed; opacity: 0.7; }

    .terminal { 
      background: #0d0d0d; border: 1px solid #333; border-radius: 8px; 
      height: 350px; overflow-y: auto; padding: 15px; font-family: Consolas, monospace; 
      font-size: 13px; line-height: 1.6; color: #4ec9b0; white-space: pre-wrap; word-wrap: break-word;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8); flex-shrink: 0;
    }
    .terminal .error { color: #f48771; }
    .terminal .success { color: #89d185; }
    .terminal .info { color: #dcdcaa; }
    
    .terminal::-webkit-scrollbar { width: 8px; }
    .terminal::-webkit-scrollbar-track { background: #0d0d0d; }
    .terminal::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

    .spinner { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* 推送后的 Gitee 同步提醒 */
    .gitee-tip {
      margin-top: 14px; padding: 14px 18px; flex-shrink: 0;
      background: rgba(240, 173, 78, 0.10);
      border: 1px solid rgba(240, 173, 78, 0.55);
      border-left: 4px solid #f0ad4e;
      border-radius: 8px;
    }
    .gitee-head { color: #f0ad4e; font-weight: bold; font-size: 14px; margin-bottom: 6px; }
    .gitee-body { color: #ccc; font-size: 13px; line-height: 1.6; }
    .gitee-ver { margin-left: 8px; color: #89d185; font-family: Consolas, monospace; }
    .gitee-actions { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
    .gitee-actions a {
      color: #4ec9b0; text-decoration: none; font-size: 13px; font-weight: bold;
      border-bottom: 1px dashed #4ec9b0; padding-bottom: 1px;
    }
    .gitee-actions a:hover { color: #7fe3d0; }
    .gitee-close {
      margin-left: auto; background: #333; color: #ddd; border: 1px solid #555;
      padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    .gitee-close:hover { background: #444; color: #fff; }
    .gitee-hint { margin-top: 8px; color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app" class="container">
    <div class="header">
      <h1>🚀 一键部署到 GitHub</h1>
      <p>配置一次，以后只需点击即可将本地所有修改同步到云端</p>
    </div>

    <div class="config-panel">
      <div class="config-header" @click="isConfigOpen = !isConfigOpen">
        <h3>⚙️ GitHub 配置</h3>
        <span class="arrow" :class="{ open: isConfigOpen }">▼</span>
      </div>
      
      <div class="config-body" v-show="isConfigOpen">
        <div class="form-group">
          <label>GitHub 用户名</label>
          <input type="text" v-model="config.userName" placeholder="如: octocat" />
        </div>
        <div class="form-group">
          <label>GitHub 邮箱</label>
          <input type="text" v-model="config.userEmail" placeholder="如: octocat@github.com" />
        </div>
        
        <div class="form-group full-width">
          <label>仓库地址 (HTTPS)</label>
          <input type="text" v-model="config.repoUrl" placeholder="如: https://github.com/用户名/仓库名.git" />
        </div>
        
        <div class="form-group full-width">
          <label>Personal Access Token (必填)</label>
          <input type="password" v-model="config.token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
          <div class="help-text">
            <a href="https://github.com/settings/tokens" target="_blank" style="color: #0e639c;">去 GitHub 生成 Token</a> 
            (勾选 repo 和 workflow 权限即可)
          </div>
        </div>
      </div>
    </div>

    <div class="push-form">
      <div class="note-field">
        <label class="note-label">📝 更新说明（会显示在后台仪表盘的系统提示里）</label>
        <textarea
          v-model="pushNote"
          rows="3"
          maxlength="200"
          placeholder="例如：新增世界观树分类、修复地图导入、优化导航栏。不填则显示：作者正在给自己的网站更新中，这一版还在测试，先别更新哦～"
          :disabled="isPushing"
        ></textarea>
        <div class="note-count">{{ pushNote.length }} / 200</div>
        <div class="note-presets">
          <button type="button" class="preset-btn" :class="{ on: publishMode === 'self' }" @click="usePreset('self')" :disabled="isPushing">
            🛠 作者自用更新（不发新版本）
          </button>
          <button type="button" class="preset-btn" :class="{ on: publishMode === 'test' }" @click="usePreset('test')" :disabled="isPushing">
            🧪 更新测试中（发新版本）
          </button>
        </div>
        <div class="preset-hint" v-if="publishMode">
          <template v-if="publishMode === 'self'">本次推送<b>不会</b>生成新版本号，别人的客户端不会提示更新</template>
          <template v-else>本次推送<b>会</b>生成新版本号，别人点检测更新就能看到（说明里已提醒先别更新）</template>
        </div>
      </div>
      <div class="action-row">
        <input 
          type="text" 
          v-model="commitMsg" 
          placeholder="提交信息（Git 记录用，如：更新第3章）" 
          @keyup.enter="pushToGithub"
          :disabled="isPushing"
        />
        <button class="btn-save" @click="saveConfig">💾 保存配置</button>
        <button class="btn-push" @click="pushToGithub" :disabled="isPushing || !commitMsg.trim()">
          <span v-if="isPushing" class="spinner">⏳</span>
          <span v-else>🚀</span>
          {{ isPushing ? '推送中...' : '立即推送' }}
        </button>
      </div>
    </div>

    <div class="terminal" ref="terminalRef" v-html="formattedLogs"></div>

    <!-- 💡 推送成功后提醒同步 Gitee -->
    <div class="gitee-tip" v-if="giteeHint">
      <div class="gitee-head">⚠ 已推送到 GitHub　—　别忘了同步 Gitee</div>
      <div class="gitee-body">
        客户端会先读 GitHub，连不上才切 Gitee。Gitee 落后的话，朋友在墙内可能拉到旧版本。
        <span v-if="pushedVersion" class="gitee-ver">本次版本：{{ pushedVersion }}</span>
      </div>
      <div class="gitee-actions">
        <a :href="giteeHint.repoUrl" target="_blank" rel="noopener">打开 Gitee 仓库</a>
        <a :href="giteeHint.settingsUrl" target="_blank" rel="noopener">镜像管理</a>
        <button class="gitee-close" @click="giteeHint = null">知道了</button>
      </div>
      <div class="gitee-hint">路径：仓库页 → 管理 → 仓库镜像管理 → 手动同步</div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;
    const API_BASE = 'http://localhost:3001/api';

    createApp({
      setup() {
        const config = ref({ repoUrl: '', userName: '', userEmail: '', token: '' });
        const isConfigOpen = ref(false);
        const commitMsg = ref('Update world settings from admin panel');
        const pushNote = ref('');
        // '' = 不干预（用勾选/默认值）；'self' = 作者自用不发版本；'test' = 测试中（发版本）
        const publishMode = ref('');
        const PRESET_SELF = '作者正在给自己的网站更新，暂不发布新版本，先别更新哦～';
        const PRESET_TEST = '更新测试中，请不要更新（作者正在调试），等稳定了再更哦～如果不小心更新了，请进入安装目录，点击「安装与更新.bat」，按提示修复就好啦';

        const usePreset = (kind) => {
          if (publishMode.value === kind) {   // 再点一次 = 取消
            publishMode.value = '';
            return;
          }
          publishMode.value = kind;
          pushNote.value = kind === 'self' ? PRESET_SELF : PRESET_TEST;
        };
        const giteeHint = ref(null);
        const pushedVersion = ref('');
        const isPushing = ref(false);

        // 💡 等后端重启回来（重启期间请求会失败，一直重试到成功）
        const waitForServerBack = async (maxMs = 60000) => {
          await new Promise((r) => setTimeout(r, 2500));
          const t0 = Date.now();
          while (Date.now() - t0 < maxMs) {
            try {
              const r = await fetch(`${API_BASE}/update/status?t=${Date.now()}`, { cache: 'no-store' });
              if (r.ok) return true;
            } catch (e) { /* 还没起来 */ }
            await new Promise((r) => setTimeout(r, 1000));
          }
          return false;
        };
        const logs = ref('');
        const terminalRef = ref(null);

        const formattedLogs = computed(() => {
          if (!logs.value) return '> 终端就绪，等待指令...\n';
          let html = logs.value;
          html = html.replace(/(> .*)/g, '<span class="info">$1</span>');
          html = html.replace(/(Error:|fatal:|error:)/gi, '<span class="error">$1</span>');
          html = html.replace(/(\[SUCCESS\].*)/gi, '<span class="success">$1</span>');
          html = html.replace(/(\[INFO\].*)/gi, '<span class="info">$1</span>');
          html = html.replace(/(\[ERROR\].*)/gi, '<span class="error">$1</span>');
          return html;
        });

        watch(logs, () => {
          nextTick(() => {
            if (terminalRef.value) terminalRef.value.scrollTop = terminalRef.value.scrollHeight;
          });
        });

        const loadConfig = async () => {
          try {
            const res = await fetch(`${API_BASE}/git/config?t=${Date.now()}`);
            const data = await res.json();
            if (data) config.value = data;
            if (!data.repoUrl || !data.token) isConfigOpen.value = true;
          } catch (e) {}
        };

        const saveConfig = async () => {
          if (!config.value.repoUrl || !config.value.token) {
            logs.value += `\n[ERROR] 仓库地址和 Token 不能为空！\n`;
            return;
          }
          try {
            await fetch(`${API_BASE}/git/config`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(config.value)
            });
            logs.value += `\n[INFO] ✅ 配置已成功保存到本地。\n`;
          } catch (e) {
            logs.value += `\n[ERROR] 保存配置失败，请检查 server.js 是否运行。\n`;
          }
        };

        const pushToGithub = async () => {
          if (!config.value.repoUrl || !config.value.token) {
            isConfigOpen.value = true;
            logs.value += `\n[ERROR] 请先在配置面板填写仓库地址和 Token！\n`;
            return;
          }
          if (!commitMsg.value.trim() || isPushing.value) return;
          
          isPushing.value = true;
          
          try {
            await fetch(`${API_BASE}/git/config`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(config.value)
            });

            logs.value += `\n[USER] 开始推送，提交信息: "${commitMsg.value}"\n`;
            const res = await fetch(`${API_BASE}/git/push`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: commitMsg.value, note: pushNote.value, bumpVersion: publishMode.value !== 'self' })
            });
            const data = await res.json();
            
            if (data.log) logs.value += data.log;
            else if (data.error) logs.value += `[ERROR] ${data.error}\n`;

            // 💡 推送成功 → 显示 Gitee 同步提醒
            if (data.success) {
              giteeHint.value = data.gitee || null;
              pushedVersion.value = data.versionId || '';
              pushNote.value = '';
              publishMode.value = '';

              // 💡 先通知外层主控台（必须在重启分支之前，否则会被 return 跳过）
              if (window.parent && window.parent !== window) {
                if (data.gitee) {
                  window.parent.postMessage({
                    type: 'GITEE_SYNC_HINT',
                    version: data.versionId || '',
                    repoUrl: data.gitee.repoUrl || '',
                    settingsUrl: data.gitee.settingsUrl || ''
                  }, '*');
                }
                window.parent.postMessage({
                  type: 'PUSH_DONE',
                  version: data.versionId || ''
                }, '*');
              }

              // 💡 后端会重启：等它回来再刷新本插件页（父页面不刷新，弹窗还在）
              if (data.restarting) {
                logs.value += '\n[RESTART] 推送完成，正在重启后台服务…\n';
                await waitForServerBack();
                window.location.reload();
                return;
              }
            }
            
          } catch (e) {
            logs.value += `[ERROR] 请求失败，请检查 Node.js 服务是否运行。\n`;
          } finally {
            isPushing.value = false;
          }
        };

        onMounted(loadConfig);

        return { pushNote, publishMode, usePreset, 
          config, isConfigOpen, commitMsg, isPushing, logs, formattedLogs, terminalRef, 
          giteeHint, pushedVersion,
          saveConfig, pushToGithub 
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
