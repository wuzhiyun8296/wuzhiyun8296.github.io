<!-- 文件路径: plugin/epoch-map.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>纪元地图数据配置</title>
  <script src="/libs/vue/vue.global.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #1e1e1e; color: #ccc; font-family: 'Segoe UI', Tahoma, sans-serif; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { margin: 0; color: #fff; }
    .btn { background: #0e639c; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;}
    .btn:hover { background: #1177bb; }
    .btn-danger { background: #a82626; }
    .btn-danger:hover { background: #c92a2a; }
    .btn-success { background: #2ea043; }
    .btn-success:hover { background: #3fb950; }
    .btn-outline { background: transparent; border: 1px solid #0e639c; color: #0e639c; }
    .btn-outline:hover { background: rgba(14, 99, 156, 0.2); }
    
    .section { background: #252526; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .section h3 { margin-top: 0; color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; }
    
    /* 折叠卡片样式 */
    .epoch-card { background: #1e1e1e; border: 1px solid #444; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
    .epoch-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; cursor: pointer; user-select: none; transition: background 0.2s; }
    .epoch-header:hover { background: #2d2d2d; }
    .epoch-header .title { font-weight: bold; color: #fff; font-size: 15px; display: flex; align-items: center; gap: 10px; }
    .epoch-header .arrow { transition: transform 0.3s; font-size: 12px; color: #888; }
    .epoch-header .arrow.open { transform: rotate(180deg); }
    .epoch-body { padding: 15px; border-top: 1px solid #333; background: #1a1a1a; }
    
    .form-row { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; }
    .form-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 13px; color: #aaa; }
    input[type="text"], input[type="number"], select, textarea { background: #121212; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; outline: none; width: 100%; }
    input:focus, textarea:focus, select:focus { border-color: #0e639c; }
    input[type="color"] { width: 40px; height: 38px; padding: 0; border: none; border-radius: 4px; cursor: pointer; background: transparent; }
    
    /* 画板布局 */
    .map-editor-layout { display: flex; gap: 20px; align-items: flex-start; margin-top: 15px; }
    .canvas-wrapper { background: #121212; border: 2px dashed #444; border-radius: 8px; position: relative; }
    .canvas-wrapper:hover { border-color: #0e639c; }
    canvas { display: block; border-radius: 6px; cursor: crosshair; }
    .canvas-tooltip { position: absolute; top: -10px; left: 10px; background: #0e639c; color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 4px; transform: translateY(-50%); }
    
    .sidebar-editor { flex: 1; display: flex; flex-direction: column; gap: 15px; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #444; }
    
    /* 💡 高级胶囊复选框样式 */
    .checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px; }
    .epoch-tag {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
      background: #1e1e1e; border: 1px solid #444; border-radius: 20px;
      color: #888; font-size: 13px; cursor: pointer; transition: all 0.2s; user-select: none;
    }
    .epoch-tag:hover { border-color: #0e639c; color: #fff; }
    .epoch-tag.active { background: rgba(14, 99, 156, 0.2); border-color: #0e639c; color: #fff; }
    /* 隐藏原生复选框 */
    .epoch-tag input[type="checkbox"] { display: none; }
    /* 自定义前面的圆圈/打勾 */
    .epoch-tag::before { content: '○'; font-size: 14px; color: #666; transition: all 0.2s; }
    .epoch-tag.active::before { content: '✔'; color: #0e639c; font-weight: bold; }
    
    .empty-tip { color: #888; font-style: italic; font-size: 14px; padding: 10px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h2>🗺️ 纪元演变数据配置</h2>
      <button class="btn btn-success" @click="saveData">💾 保存数据到前台</button>
    </div>

    <!-- 1. 纪元设置 (倒序展示 + 折叠) -->
    <div class="section">
      <h3>⏳ 纪元时间轴（最新纪元在顶部）</h3>
      <div class="empty-tip" v-if="data.epochs.length === 0">暂无纪元，请先添加。</div>
      
      <div class="epoch-card" v-for="epoch in displayEpochs" :key="epoch.id">
        <div class="epoch-header" @click="toggleEpoch(epoch.id)">
          <div class="title">
            <span style="color: #0e639c;">#{{ epoch.id }}</span> 
            {{ epoch.name || '未命名纪元' }}
          </div>
          <div class="arrow" :class="{ open: isExpanded(epoch.id) }">▼</div>
        </div>
        
        <div class="epoch-body" v-show="isExpanded(epoch.id)">
          <div class="form-row">
            <div class="form-group" style="flex: 0.2;">
              <label>纪元 ID (按顺序递增)</label>
              <input type="number" v-model.number="epoch.id" />
            </div>
            <div class="form-group" style="flex: 1;">
              <label>纪元名称</label>
              <input type="text" v-model="epoch.name" />
            </div>
          </div>
          <div class="form-group">
            <label>纪元描述</label>
            <input type="text" v-model="epoch.desc" />
          </div>
          <button class="btn btn-danger" style="margin-top: 10px;" @click.stop="deleteEpoch(epoch.id)">删除此纪元</button>
        </div>
      </div>
      
      <button class="btn btn-outline" @click="addEpoch" style="margin-top: 10px;">+ 添加新纪元</button>
    </div>

    <!-- 2. 国家/势力版图绘制 -->
    <div class="section">
      <h3>🌍 国家/势力版图（鼠标在画板上点击绘制）</h3>
      
      <div v-if="data.countries.length === 0" class="empty-tip">
        暂无势力。请先点击下方按钮添加。
      </div>

      <div class="map-editor-layout" v-else>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div class="canvas-wrapper">
            <div class="canvas-tooltip" v-if="activeCountry">正在编辑：{{ activeCountry.name }}</div>
            <canvas ref="canvasRef" width="600" height="400" @click="handleCanvasClick"></canvas>
          </div>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" @click="clearCanvas" style="flex:1;">🗑️ 清空当前图形</button>
            <button class="btn" @click="closeShape" style="flex:1;">✅ 完成闭合</button>
          </div>
        </div>

        <div class="sidebar-editor">
          <div class="form-group">
            <label>选择要编辑的势力</label>
            <select v-model="activeCountryIndex" @change="loadActiveCountry">
              <option v-for="(c, i) in data.countries" :key="i" :value="i">{{ c.name || '未命名势力' }}</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>势力名称</label>
              <input type="text" v-model="activeCountry.name" />
            </div>
            <div class="form-group" style="flex: 0;">
              <label>地图颜色</label>
              <input type="color" v-model="activeCountry.color" />
            </div>
            <button class="btn btn-danger" @click="deleteCountry(activeCountryIndex)">删除</button>
          </div>

          <div class="form-group">
            <label>存在的纪元 (点击标签勾选)</label>
            <div class="checkbox-group">
              <label 
                class="epoch-tag" 
                v-for="ep in data.epochs" 
                :key="ep.id"
                :class="{ active: activeCountry.visibleIn.includes(String(ep.id)) }"
              >
                <input type="checkbox" :value="String(ep.id)" v-model="activeCountry.visibleIn" />
                {{ ep.name }}
              </label>
            </div>
          </div>
        </div>
      </div>
      
      <button class="btn btn-outline" @click="addCountry" style="margin-top: 15px;">+ 添加新势力</button>
    </div>
  </div>

  <script>
    const { createApp, ref, onMounted, computed, watch } = Vue;
    const API_BASE = 'http://localhost:3001/api';
    const JSON_FILE_PATH = 'public/epoch-map-data.json';

    createApp({
      setup() {
        const data = ref({ epochs: [], countries: [] });
        const activeCountryIndex = ref(0);
        const canvasRef = ref(null);
        let ctx = null;

        const activeCountry = ref({ visibleIn: [] });
        const drawingPoints = ref([]);

        // ========== 系统消息提示 ==========
        const showToast = (msg, isError = false) => {
          const oldToast = document.getElementById('custom-toast'); if (oldToast) oldToast.remove();
          const toast = document.createElement('div'); 
          toast.id = 'custom-toast'; 
          toast.innerText = msg;
          toast.style = `position:fixed; bottom:30px; right:30px; background:${isError ? '#a82626' : '#2ea043'}; color:#fff; padding:12px 24px; border-radius:6px; z-index:99999; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-weight: bold; opacity: 0; transform: translateY(20px); pointer-events: none;`;
          document.body.appendChild(toast);
          
          requestAnimationFrame(() => {
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';
          });
          
          setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(20px)';
            setTimeout(() => toast.remove(), 300);
          }, 2500);
        };

        // ========== 折叠与倒序逻辑 ==========
        const expandedEpochs = ref({}); 
        
        const displayEpochs = computed(() => {
          return [...data.value.epochs].reverse();
        });

        const toggleEpoch = (id) => {
          expandedEpochs.value[id] = !expandedEpochs.value[id];
        };

        // 💡 核心修改：只有明确记录为 true 的时候才展开，否则默认折叠
        const isExpanded = (id) => {
          return expandedEpochs.value[id] === true; 
        };

        // ========== 数据加载与保存 ==========
        const loadData = async () => {
          try {
            const res = await fetch(`${API_BASE}/file?path=${encodeURIComponent(JSON_FILE_PATH)}&t=${Date.now()}`);
            const fileData = await res.json();
            if (fileData.content) {
              const parsed = JSON.parse(fileData.content);
              data.value = {
                epochs: (parsed.epochs || []).map(e => ({ ...e, id: String(e.id) })),
                countries: (parsed.countries || []).map(c => ({
                  ...c,
                  visibleIn: Array.isArray(c.visibleIn) ? c.visibleIn.map(String) : []
                }))
              };
            }
            if (data.value.countries.length > 0) {
              loadActiveCountry();
            }
          } catch (e) {
            console.error('读取失败:', e);
            showToast('读取数据失败', true);
          }
        };

        const loadActiveCountry = () => {
          const country = data.value.countries[activeCountryIndex.value];
          if (!country) return;
          activeCountry.value = country;

          if (!country.path) {
            drawingPoints.value = [];
          } else {
            const matches = country.path.match(/[0-9.]+/g);
            if (matches) {
              const pts = [];
              for (let i = 0; i < matches.length; i += 2) {
                pts.push({ x: parseFloat(matches[i]), y: parseFloat(matches[i+1]) });
              }
              drawingPoints.value = pts;
            }
          }
          drawCanvas();
        };

        // ========== 画布绘制逻辑 ==========
        watch(() => activeCountry.value.path, (newPath) => {
          if (drawingPoints.value.length > 0) {
            let sumX = 0, sumY = 0;
            drawingPoints.value.forEach(p => { sumX += p.x; sumY += p.y; });
            activeCountry.value.labelX = Math.round(sumX / drawingPoints.value.length);
            activeCountry.value.labelY = Math.round(sumY / drawingPoints.value.length);
          }
        });

        const drawCanvas = () => {
          if (!canvasRef.value) return;
          ctx = canvasRef.value.getContext('2d');
          ctx.clearRect(0, 0, 600, 400);

          ctx.strokeStyle = '#333';
          ctx.lineWidth = 1;
          for (let x = 0; x <= 600; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 400); ctx.stroke();
          }
          for (let y = 0; y <= 400; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(600, y); ctx.stroke();
          }

          if (drawingPoints.value.length > 0) {
            ctx.beginPath();
            ctx.moveTo(drawingPoints.value[0].x, drawingPoints.value[0].y);
            for (let i = 1; i < drawingPoints.value.length; i++) {
              ctx.lineTo(drawingPoints.value[i].x, drawingPoints.value[i].y);
            }
            if (drawingPoints.value.length > 2) {
              ctx.closePath();
              ctx.fillStyle = (activeCountry.value.color || '#ff4500') + '99';
              ctx.fill();
            }
            ctx.strokeStyle = activeCountry.value.color || '#ff4500';
            ctx.lineWidth = 2;
            ctx.stroke();

            drawingPoints.value.forEach((p, i) => {
              ctx.beginPath();
              ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
              ctx.fillStyle = i === 0 ? '#fff' : activeCountry.value.color;
              ctx.fill();
            });
          }
        };

        const handleCanvasClick = (e) => {
          const rect = canvasRef.value.getBoundingClientRect();
          const x = Math.round(e.clientX - rect.left);
          const y = Math.round(e.clientY - rect.top);
          
          drawingPoints.value.push({ x, y });
          updatePathString();
          drawCanvas();
        };

        const updatePathString = () => {
          if (drawingPoints.value.length < 3) {
            activeCountry.value.path = '';
            return;
          }
          let str = `M ${drawingPoints.value[0].x} ${drawingPoints.value[0].y} `;
          for (let i = 1; i < drawingPoints.value.length; i++) {
            str += `L ${drawingPoints.value[i].x} ${drawingPoints.value[i].y} `;
          }
          str += 'Z';
          activeCountry.value.path = str;
        };

        const clearCanvas = () => {
          drawingPoints.value = [];
          activeCountry.value.path = '';
          drawCanvas();
        };

        const closeShape = () => {
          if (drawingPoints.value.length < 3) {
            showToast('至少需要点击 3 个点才能形成图形！', true);
            return;
          }
          updatePathString();
          drawCanvas();
          showToast('图形已生成闭合');
        };

        watch(() => activeCountry.value.color, () => {
          drawCanvas();
        });

        // ========== 按钮操作 ==========
        const addEpoch = () => {
          const nextId = data.value.epochs.length > 0 ? Math.max(...data.value.epochs.map(e => Number(e.id))) + 1 : 1;
          data.value.epochs.push({ id: String(nextId), name: '新纪元', desc: '描述...' });
          // 💡 新建纪元时默认展开，方便直接修改
          expandedEpochs.value[String(nextId)] = true; 
          showToast('已添加新纪元');
        };

        const deleteEpoch = (id) => {
          if (confirm('确认删除此纪元吗？该操作不可逆！')) {
            const index = data.value.epochs.findIndex(e => e.id === id);
            if (index !== -1) {
              data.value.epochs.splice(index, 1);
              showToast('纪元已删除');
            }
          }
        };

        const addCountry = () => {
          if (data.value.epochs.length === 0) {
            showToast('请先添加至少一个纪元，再添加势力版图！', true);
            return;
          }
          data.value.countries.push({
            name: '新势力', color: '#0e639c', 
            visibleIn: [], 
            path: '', labelX: 300, labelY: 200
          });
          activeCountryIndex.value = data.value.countries.length - 1;
          loadActiveCountry();
          showToast('已添加新势力，请在左侧画板绘制');
        };

        const deleteCountry = (index) => {
          if (confirm('确认删除该势力吗？')) {
            data.value.countries.splice(index, 1);
            if (data.value.countries.length > 0) {
              activeCountryIndex.value = 0;
              loadActiveCountry();
            } else {
              activeCountry.value = { visibleIn: [] };
              clearCanvas();
            }
            showToast('势力已删除');
          }
        };

        const saveData = async () => {
          try {
            const content = JSON.stringify(data.value, null, 2);
            const res = await fetch(`${API_BASE}/file`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ path: JSON_FILE_PATH, content })
            });
            const result = await res.json();
            if (result.success !== false) {
              showToast('✅ 数据保存成功，请去前台刷新查看！');
            } else {
              showToast('❌ 保存失败: ' + result.error, true);
            }
          } catch (e) {
            showToast('保存请求出错', true);
          }
        };

        onMounted(async () => {
          await loadData();
        });

        return { 
          data, activeCountryIndex, canvasRef, 
          activeCountry, loadActiveCountry,
          handleCanvasClick, clearCanvas, closeShape,
          addEpoch, deleteEpoch, addCountry, deleteCountry, saveData,
          displayEpochs, toggleEpoch, isExpanded
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
