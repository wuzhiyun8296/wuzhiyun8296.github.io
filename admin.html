<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>世界观 - 本地编辑后台</title>
  <script src="/libs/vue/vue.global.prod.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <style>
    /* ---------- 全局暗色细滚动条 ---------- */
    * { scrollbar-width: thin; scrollbar-color: #3c3c3c transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #3c3c3c; border-radius: 8px;
      border: 2px solid transparent; background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: #4e4e4e; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:active { background: #5c5c5c; background-clip: content-box; }
    ::-webkit-scrollbar-corner { background: transparent; }

    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; background: #1e1e1e; color: #ccc; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
    
    /* ================= 登录遮罩层 ================= */
    .login-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; }
    .login-card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 40px; width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 20px rgba(14, 99, 156, 0.2); text-align: center; animation: slideUp 0.4s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .login-card h2 { color: #fff; margin: 0 0 10px 0; font-size: 24px; letter-spacing: 2px;}
    .login-card .subtitle { color: #888; font-size: 13px; margin-bottom: 5px; }
    .login-card .hint-text { color: #d29922; font-size: 12px; margin-bottom: 25px; font-weight: bold; }
    .login-input-group { position: relative; margin-bottom: 20px; }
    .login-input-group input { width: 100%; background: #121212; border: 1px solid #444; color: #fff; padding: 15px; border-radius: 8px; font-size: 16px; outline: none; transition: all 0.3s; text-align: center; letter-spacing: 5px; }
    .login-input-group input:focus { border-color: #0e639c; box-shadow: 0 0 10px rgba(14, 99, 156, 0.5); }
    .login-btn { width: 100%; background: #0e639c; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    .login-btn:hover { background: #1177bb; }
    .login-error { color: #a82626; font-size: 13px; margin-top: 15px; height: 20px; opacity: 0; transition: opacity 0.3s;}
    .login-error.show { opacity: 1; }
    .free-badge { margin-top: 18px; font-size: 11.5px; color: #5f6b75; letter-spacing: .3px; }

    /* ================= 通用高级模态框 ================= */
    .custom-modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100000; background: rgba(15, 15, 15, 0.7); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; }
    .custom-modal-box { background: #252526; border: 1px solid #444; border-radius: 10px; padding: 25px; width: 480px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    .custom-modal-box h3 { margin: 0 0 10px 0; color: #fff; font-size: 18px; }
    .custom-modal-box p { color: #888; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
    
    /* 更新日志展示区 */
    .update-log-box { background: #111; border: 1px solid #333; border-radius: 6px; padding: 10px; font-family: Consolas, monospace; font-size: 12px; color: #aaa; max-height: 150px; overflow-y: auto; text-align: left; margin-bottom: 15px; line-height: 1.6; }

    .modal-input-group { margin-bottom: 15px; }
    .modal-input-group input { width: 100%; background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 6px; font-size: 14px; outline: none; transition: border 0.2s; }
    .modal-input-group input:focus { border-color: #0e639c; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
    
    /* ================= 主界面 ================= */
    .main-ui { display: flex; flex-direction: column; width: 100%; height: 100%; transition: opacity 0.5s; }
    .main-ui.hidden { opacity: 0; pointer-events: none; }

    /* 💡 顶部导航核心优化 */
    .top-nav { background: #252526; display: flex; border-bottom: 1px solid #333; flex-shrink: 0; align-items: center; height: 50px; }
    .nav-group { display: flex; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; -ms-overflow-style: none; height: 100%; padding: 0 5px; scroll-behavior: smooth;}
    .nav-group::-webkit-scrollbar { display: none; }
    .nav-btn { padding: 0 15px; height: 100%; background: none; border: none; color: #888; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; flex-shrink: 0; }
    .nav-btn:hover { color: #fff; background: #2d2d2d; }
    .nav-btn.active { color: #fff; border-bottom-color: #0e639c; background: #1e1e1e; }
    .tool-menu-wrap { position: relative; }
  .tool-menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 50;
    min-width: 250px; padding: 6px; border-radius: 10px;
    background: #252526; border: 1px solid #3a3a3a;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
    display: flex; flex-direction: column; gap: 2px;
  }
  .tool-item {
    display: flex; align-items: flex-start; gap: 10px; width: 100%;
    padding: 10px 12px; border: none; border-radius: 8px;
    background: transparent; color: #ddd; cursor: pointer;
    text-align: left; transition: background .15s;
  }
  .tool-item:hover:not(:disabled) { background: #2f2f2f; }
  .tool-item:disabled { opacity: .5; cursor: not-allowed; }
  .tool-item .ti-icon { font-size: 16px; line-height: 1.2; }
  .tool-item .ti-text { display: flex; flex-direction: column; gap: 2px; }
  .tool-item .ti-text b { font-size: 13px; font-weight: 600; color: #eee; }
  .tool-item .ti-text i { font-style: normal; font-size: 11.5px; color: #888; }

  .nav-actions { display: flex; gap: 10px; padding: 0 15px; flex-shrink: 0; background: #252526; border-left: 1px solid #333; height: 100%; align-items: center; z-index: 10; box-shadow: -10px 0 15px -5px rgba(0,0,0,0.5);}
    .action-btn { background: transparent; border: 1px solid #444; color: #888; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.2s; font-weight: bold; font-size: 13px; white-space: nowrap;}
    .action-btn:hover { background: #444; color: #fff; }
    .action-btn.danger { background: #a82626; border-color: #a82626; color: #fff; }
    .action-btn.danger:hover { background: #c92a2a; border-color: #c92a2a; }

    .main-container { flex: 1; display: flex; overflow: hidden; }

    /* ========== 文章编辑区 ========== */
    #sidebar { width: 260px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 15px; background: #2d2d2d; border-bottom: 1px solid #333; display: flex; gap: 10px; }
    .sidebar-header button:disabled { opacity: .38; cursor: not-allowed; }
    
    .root-btn { padding: 6px 10px; background: #1e1e1e; color: #888; font-size: 13px; cursor: pointer; border-bottom: 1px solid #333; transition: background 0.2s; }
    .root-btn:hover { background: #333; color: #fff;}
    .root-btn.active { background: #0e639c; color: #fff; }

    .tree-container { flex: 1; overflow-y: auto; padding: 10px; }
    .node-item { padding: 6px 8px; cursor: pointer; border-radius: 4px; font-size: 14px; display: flex; align-items: center; user-select: none; justify-content: space-between;}
    .folder-item { color: #e0e0e0; font-weight: bold; margin-top: 4px; }
    .folder-item:hover { background: #333; }
    
    .folder-item.active-folder { background: rgba(14, 99, 156, 0.4); border: 1px dashed #0e639c;}
    
    .file-item { color: #aaa; padding-left: 20px; }
    .file-item:hover { background: #333; color: #fff; }
    .file-item.active { background: #0e639c; color: #fff; }
    .arrow { display: inline-block; width: 16px; transition: transform 0.2s; font-size: 12px; color: #888; }
    .arrow.open { transform: rotate(90deg); }
    .delete-btn { display: none; font-size: 12px; color: #a82626; padding: 0 4px; border-radius: 2px; }
    .delete-btn:hover { background: #a82626; color: #fff; }
    .node-item:hover .delete-btn { display: block; }
    
    #main-editor { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .toolbar { padding: 10px 15px; background: #2d2d2d; display: flex; align-items: center; border-bottom: 1px solid #333; }
    .status-text { flex: 1; font-size: 14px; color: #888; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 💡 min-height:0 是关键：不加的话 textarea 的最小高度等于内容高度，
       会一直往下长、被外层 overflow:hidden 裁掉，光标跑出可视区也不滚动 */
    .editor-split { flex: 1; display: flex; height: 100%; min-height: 0; overflow: hidden; }
    .md-textarea { width: 50%; height: 100%; min-height: 0; overflow-y: auto; background: #1e1e1e; color: #d4d4d4; border: none; border-right: 1px solid #333; padding: 20px; font-size: 15px; line-height: 1.6; font-family: Consolas, monospace; resize: none; outline: none; }
    /* 📱 网文模式开关（按钮式） */
    .webmode-btn {
      border: 1px solid #3a3a3a; background: transparent; color: #8a929c;
      border-radius: 4px; padding: 4px 10px; font-size: 12.5px; cursor: pointer;
      margin-right: 8px; transition: .15s;
    }
    .webmode-btn:hover { color: #fff; border-color: #555; }
    .webmode-btn.on { background: rgba(14,99,156,.3); border-color: #0e639c; color: #9fd6f5; }
    .webmode-select {
      background: #1e1e1e; color: #ccc; border: 1px solid #3a3a3a; border-radius: 4px;
      padding: 3px 6px; font-size: 12px; margin-right: 10px; outline: none; cursor: pointer;
    }
    .preview-pane { width: 50%; height: 100%; padding: 20px; overflow-y: auto; line-height: 1.6; font-size: 15px; }
    .preview-pane h1, .preview-pane h2, .preview-pane h3 { color: #fff; border-bottom: 1px solid #444; padding-bottom: 8px; }
    
    /* 💡 预览区表格样式 */
    .preview-pane table { border-collapse: collapse; width: 100%; margin-bottom: 20px; margin-top: 10px; }
    .preview-pane th, .preview-pane td { border: 1px solid #444; padding: 8px 12px; text-align: left; }
    .preview-pane th { background: #2d2d2d; color: #fff; font-weight: bold; }
    
    /* 💡 预览区双向链接样式 */
    .preview-pane a { color: #0e639c; text-decoration: none; border-bottom: 1px dashed #0e639c; font-weight: bold; }
    .preview-pane a:hover { color: #1177bb; border-bottom-style: solid; }

    /* 按钮 */
    button { background: #0e639c; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold; transition: background 0.2s; }
    button:hover { background: #1177bb; }
    button.secondary { background: #444; }
    button.secondary:hover { background: #555; }
    button.outline { background: transparent; border: 1px solid #0e639c; color: #0e639c; }
    button.outline:hover { background: rgba(14, 99, 156, 0.1); }
    button.danger { background: #a82626; }
    button.danger:hover { background: #c92a2a; }

    /* 插件容器 */
    .plugin-container { flex: 1; display: flex; height: 100%; width: 100%; }
    iframe { width: 100%; height: 100%; border: none; background: #1e1e1e; }

    /* 表格生成器模态框 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 10000; }
    .modal-box { background: #252526; border: 1px solid #444; border-radius: 8px; padding: 25px; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-box h3 { margin: 0 0 15px 0; color: #fff; }
    .modal-row { display: flex; gap: 15px; margin-bottom: 20px; }
    .modal-row .form-group { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .modal-row label { margin-bottom: 5px; font-size: 13px; color: #aaa; }
    .modal-row input { background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 4px; width: 100%; }

    /* 更新进度转圈 */
    .modal-spinner { display: flex; justify-content: center; gap: 8px; margin: 18px 0 6px; }
    .modal-spinner span {
      width: 10px; height: 10px; border-radius: 50%;
      background: #0e639c; display: block;
      animation: modal-bounce 1.2s infinite ease-in-out;
    }
    .modal-spinner span:nth-child(2) { animation-delay: .18s; background: #1177bb; }
    .modal-spinner span:nth-child(3) { animation-delay: .36s; background: #4aa3df; }
    @keyframes modal-bounce {
      0%, 80%, 100% { transform: scale(0.5); opacity: .35; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* 下载进度条 */
    .modal-progress {
      height: 8px; margin: 14px 0 4px;
      background: #333; border-radius: 6px; overflow: hidden;
    }
    .modal-progress i {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #0e639c, #4aa3df);
      border-radius: 6px;
      transition: width .25s ease;
    }
  
  /* ---------- 📱 手机端：导航换行显示，不用横向滑 ---------- */
  @media (max-width: 760px) {
    .top-nav {
      height: auto; flex-direction: column; align-items: stretch;
    }
    .nav-group {
      flex-wrap: wrap; overflow-x: visible; gap: 6px;
      padding: 8px; height: auto;
    }
    .nav-group::-webkit-scrollbar { display: none; }
    .nav-group {
      align-items: flex-start; overflow-x: hidden;
      gap: 4px; padding: 6px 8px 8px;
    }
    .top-nav { overflow-x: hidden; }
    .nav-btn {
      flex-shrink: 0; height: auto; line-height: 1.25;
      padding: 7px 9px; font-size: 12.5px;
      border-radius: 8px; background: #2a2a2a;
      border-bottom: none; white-space: nowrap;
    }
    .nav-btn.active { background: #0e639c; }
    .nav-actions {
      height: auto; padding: 6px 8px; gap: 6px; flex-wrap: nowrap;
      overflow-x: auto; border-left: none; border-top: 1px solid #333;
      justify-content: flex-start; box-shadow: none;
      scrollbar-width: none;
    }
    .nav-actions::-webkit-scrollbar { display: none; }
    .nav-actions .action-btn {
      padding: 7px 10px; font-size: 12.5px; white-space: nowrap; flex-shrink: 0;
    }
    .plugin-container, .plugin-container iframe { width: 100%; }
    .main-container { flex-direction: column; }
    #sidebar {
      width: 100% !important; max-height: 38vh; border-right: none;
      border-bottom: 1px solid #333;
    }
    .login-card { width: calc(100vw - 32px) !important; padding: 24px 20px !important; }
    .custom-modal-box { width: calc(100vw - 32px) !important; }
  }

  /* ---------- 📱 手机端：抽屉式插件选择 ---------- */
  /* 桌面端默认全部隐藏，只有手机端媒体查询里才显示 */
  .m-bar, .m-mask, .m-drawer { display: none !important; }

  @media (max-width: 760px) {
    /* 隐藏原来的横向导航，改用抽屉 */
    .top-nav { display: none; }

    .m-bar {
      display: flex !important; align-items: center; gap: 10px;
      height: 50px; padding: 0 10px 0 6px;
      background: #232326; border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    .m-menu, .m-tool {
      width: 40px; height: 40px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #2c2c30; border: 1px solid #3a3a3a; border-radius: 10px;
      color: #ddd; font-size: 17px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .m-menu:active, .m-tool:active { background: #35353a; }
    .m-title {
      flex: 1; min-width: 0; text-align: center;
      font-size: 14.5px; color: #eee; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .m-mask {
      display: block !important; position: fixed; inset: 0; z-index: 90;
      background: rgba(0, 0, 0, .55); opacity: 0; pointer-events: none;
      transition: opacity .22s;
    }
    .m-mask.show { opacity: 1; pointer-events: auto; }

    .m-drawer {
      display: flex !important;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 91;
      width: 78vw; max-width: 300px;
      background: #1f1f22; border-right: 1px solid #333;
      display: flex; flex-direction: column;
      transform: translateX(-102%); transition: transform .24s ease;
      box-shadow: 12px 0 32px rgba(0, 0, 0, .5);
    }
    .m-drawer.open { transform: translateX(0); }

    .m-drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 16px 12px; color: #ddd; font-size: 15px; font-weight: 600;
      border-bottom: 1px solid #2e2e2e; flex-shrink: 0;
    }
    .m-close {
      width: 32px; height: 32px; border: none; border-radius: 8px;
      background: transparent; color: #888; font-size: 16px; cursor: pointer;
    }
    .m-close:active { background: #2c2c30; }

    .m-drawer-list {
      flex: 1; overflow-y: auto; padding: 8px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .m-item {
      display: block; width: 100%; box-sizing: border-box; text-align: left;
      padding: 13px 14px; border: none; border-radius: 10px;
      background: transparent; color: #ccc; font-size: 14.5px; line-height: 1.45;
      cursor: pointer; white-space: normal; overflow: visible; text-overflow: clip;
      word-break: break-word;
    }
    .m-item:active { background: #2c2c30; }
    .m-item.active { background: #0e639c; color: #fff; font-weight: 600; }

    .m-drawer-foot {
      flex-shrink: 0; padding: 10px; border-top: 1px solid #2e2e2e;
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .m-act {
      flex: 1; min-width: 84px; padding: 10px 8px;
      border-radius: 10px; border: 1px solid #3a3a3a;
      background: #26262a; color: #ddd; font-size: 13px; cursor: pointer;
    }
    .m-act:active { background: #303036; }
    .m-act.danger { color: #e88; border-color: #5a2a2a; background: rgba(168, 38, 38, .18); }

    /* 内容区上不留多余空白 */
    .main-container { padding: 0; }
  }
    /* admin-mobile-patch：文章编辑在手机上单栏显示 */
    @media (max-width: 760px) {
      .editor-split { flex-direction: column; }
      .md-textarea, .preview-pane { width: 100% !important; height: 50% !important; border-right: none; border-bottom: 1px solid #333; }
      .toolbar { flex-wrap: wrap; gap: 6px; }
    }
  </style>
</head>
<body>
  <div id="app">
    
    <!-- ================= 登录遮罩 ================= -->
    <div class="login-overlay" v-if="!isAuthenticated">
      <div class="login-card">
        <h2>准入验证</h2>
        <div class="subtitle">请输入密码以进入幻想域主控台</div>
        <div class="hint-text">💡 {{ loginHint }}</div>
        <div class="login-input-group">
          <input type="password" v-model="password" @keyup.enter="handleLogin" placeholder="••••••" autofocus />
        </div>
        <button class="login-btn" @click="handleLogin">进 入 系 统</button>
        <div class="login-error" :class="{ show: showError }">密码错误，请重试</div>
        <div class="free-badge">本软件完全免费 · 任何收费渠道均非官方 · 作者 <a href="https://space.bilibili.com/662538781" target="_blank" rel="noopener" style="color:#7fc4ee;text-decoration:none;border-bottom:1px dashed #3a5f7a;">bilibili@雾之韵8296</a></div>
      </div>
    </div>

    <!-- ================= 通用高级模态框 ================= -->
    <div class="custom-modal-overlay" v-if="modal.show" @click.self="closeModal">
      <div class="custom-modal-box">
        <h3>{{ modal.title }}</h3>
        <p v-if="modal.message" v-html="modal.message"></p>
        <div v-if="typeof modal.progress === 'number'" class="modal-progress">
          <i :style="{ width: modal.progress + '%' }"></i>
        </div>
        <div v-if="modal.loading" class="modal-spinner"><span></span><span></span><span></span></div>
        
        <div class="modal-input-group" v-if="modal.type === 'prompt'">
          <input v-model="modal.input1" :placeholder="modal.placeholder1" @keyup.enter="confirmModal" autofocus />
        </div>
        
        <div v-if="modal.type === 'prompt-double'">
          <div class="modal-input-group">
            <input type="password" v-model="modal.input1" :placeholder="modal.placeholder1" @keyup.enter="confirmModal" autofocus />
          </div>
          <div class="modal-input-group">
            <input type="text" v-model="modal.input2" :placeholder="modal.placeholder2" @keyup.enter="confirmModal" />
          </div>
        </div>

        <!-- 💡 更新日志展示区 -->
        <div v-if="modal.updateLogs" class="update-log-box" v-html="modal.updateLogs"></div>

        <div class="modal-actions" v-if="!modal.hideActions">
          <button class="secondary" v-if="modal.type !== 'alert'" @click="closeModal">取消</button>
          <button :class="{ danger: modal.isDanger }" @click="confirmModal">{{ modal.type === 'alert' ? '知道了' : '确认' }}</button>
        </div>
      </div>
    </div>

    <!-- ================= 主界面 ================= -->
    <div class="main-ui" :class="{ hidden: !isAuthenticated }">

      <!-- 📱 手机端：一行顶栏 + 侧边抽屉 -->
      <div class="m-bar">
        <button class="m-menu" @click="navDrawer = true" aria-label="选择插件">☰</button>
        <span class="m-title">{{ currentTitle }}</span>
        <button class="m-tool" @click="toggleTools" aria-label="工具">🧰</button>
      </div>

      <div class="m-mask" :class="{ show: navDrawer }" @click="navDrawer = false"></div>
      <aside class="m-drawer" :class="{ open: navDrawer }">
        <div class="m-drawer-head">
          <span>📚 插件</span>
          <button class="m-close" @click="navDrawer = false">✕</button>
        </div>
        <div class="m-drawer-list">
          <button
            class="m-item"
            :class="{ active: currentTab === 'dashboard' }"
            @click="goTab('dashboard')"
          >📊 仪表盘</button>
          <button
            v-for="p in dynamicPlugins"
            :key="p.id"
            v-show="p.id !== 'dashboard'"
            class="m-item"
            :class="{ active: currentTab === p.id }"
            @click="goTab(p.id)"
          >{{ p.icon || '🧩' }} {{ p.name }}</button>
        </div>
        <div class="m-drawer-foot">
          <button class="m-act" @click="navDrawer = false; checkUpdate()" :disabled="isCheckingUpdate">🔄 检测更新</button>
          <button class="m-act" @click="navDrawer = false; changePassword()">🔐 改密</button>
          <button class="m-act danger" @click="navDrawer = false; logout()">退出登录</button>
        </div>
      </aside>

      <div class="top-nav">
        <!-- 💡 添加 @wheel 监听，实现鼠标滚轮横向滑动 -->
        <div class="nav-group" @wheel.prevent="handleNavWheel" ref="navGroupRef">
          <!-- 仪表盘永远固定在第一位 -->
          <button class="nav-btn" :class="{ active: currentTab === 'dashboard' }" @click="currentTab = 'dashboard'">📊 仪表盘</button>
          
          <!-- 其他所有插件全部由 navigation.json 的顺序动态渲染 -->
          <template v-for="p in dynamicPlugins" :key="p.id">
            <button 
              v-if="p.id !== 'dashboard'"
              class="nav-btn" 
              :class="{ active: currentTab === p.id }" 
              @click="currentTab = p.id"
            >
              {{ p.icon || '🧩' }} {{ p.name }}
            </button>
          </template>
        </div>
        
        <div class="nav-actions">
          <button class="action-btn" @click="checkUpdate">🔄 检测更新</button>
          <div class="tool-menu-wrap" ref="toolRef">
            <button class="action-btn" @click="toggleTools" :disabled="isCheckingUpdate">🧰 工具 ▾</button>
            <div class="tool-menu" v-show="toolsOpen">
              <button class="tool-item" @click="pickTool('repair')" :disabled="isCheckingUpdate">
                <span class="ti-icon">🔧</span>
                <span class="ti-text"><b>修复文件</b><i>重新下载缺失或损坏的文件</i></span>
              </button>
              <button class="tool-item" @click="pickTool('restart')">
                <span class="ti-icon">♻️</span>
                <span class="ti-text"><b>重启后台</b><i>让改过的代码立刻生效</i></span>
              </button>
            </div>
          </div>
          <button class="action-btn" @click="changePassword">🔐 改密</button>
          <button class="action-btn danger" @click="logout">退出登录</button>
        </div>
      </div>

      <div class="main-container">
        <template v-if="currentTab === 'article'">
          <div id="sidebar">
            <div class="sidebar-header">
              <button @click="newFile" style="flex:1;" :disabled="!selectedFolder" :title="selectedFolder ? '在选中文件夹下新建文件' : '根目录不能直接建文件，请先选一个文件夹'">新建文件</button>
              <button class="secondary" @click="newFolder" style="flex:1;">新建文件夹</button>
            </div>
            
            <div class="root-btn" :class="{ active: selectedFolder === '' }" @click="selectedFolder = ''; currentPath = ''">
              🏠 根目录（仅可新建文件夹）
            </div>

            <div class="tree-container">
              <tree-node 
                v-for="(item, index) in tree" 
                :key="index" 
                :item="item" 
                :current-path="currentPath" 
                :selected-folder="selectedFolder"
                :parent-path="''"
                @select="loadFile" 
                @select-folder="selectedFolder = $event"
                @delete="deleteNode" 
              />
            </div>
          </div>
          <div id="main-editor">
            <div class="toolbar">
              <span class="status-text">{{ currentPath || '请选择或新建文件' }}</span>
              <button class="webmode-btn" :class="{ on: webMode }" @click="webMode = !webMode"
                      title="开启后按回车会留出空行，符合网文排版">
                📱 网文模式{{ webMode ? '：开' : '：关' }}
              </button>
              <select v-if="webMode" v-model.number="webBlankLines" class="webmode-select" title="段落之间空几行">
                <option :value="1">空一行</option>
                <option :value="2">空两行</option>
              </select>
              <button v-if="currentPath" class="outline" @click="mdUndo" :disabled="!canMdUndo" style="margin-right: 8px;" title="撤销 (Ctrl+Z)">↶ 撤销</button>
              <button v-if="currentPath" class="outline" @click="mdRedo" :disabled="!canMdRedo" style="margin-right: 8px;" title="重做 (Ctrl+Y)">↷ 重做</button>
              <button v-if="currentPath" class="outline" @click="showTableModal = true" style="margin-right: 10px;">📊 插入表格</button>
              <button @click="saveFile" v-if="currentPath">保存内容 (Ctrl+S)</button>
            </div>
            <div class="editor-split" v-if="currentPath">
              <textarea id="md-editor" class="md-textarea" v-model="content" @input="onMdInput" @keydown="onMdKeydown" placeholder="书写 Markdown..."></textarea>
              <div class="preview-pane" v-html="renderedHtml"></div>
            </div>
            <div v-else style="flex:1; display:flex; align-items:center; justify-content:center; color:#555; font-size:20px;">请选择或新建文件</div>
          </div>
        </template>

        <div class="plugin-container" v-else>
          <iframe :src="pluginSrc"></iframe>
        </div>
      </div>

    </div>

    <!-- 表格生成器模态框 -->
    <div class="modal-overlay" v-if="showTableModal" @click.self="showTableModal = false">
      <div class="modal-box">
        <h3>插入表格</h3>
        <div class="modal-row">
          <div class="form-group">
            <label>行数</label>
            <input type="number" v-model.number="tableRows" min="1" />
          </div>
          <div class="form-group">
            <label>列数</label>
            <input type="number" v-model.number="tableCols" min="1" />
          </div>
        </div>
        <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px;">
          <button class="secondary" @click="showTableModal = false">取消</button>
          <button @click="insertTable">确认插入</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const { createApp, ref, computed, onMounted, onUnmounted, nextTick, watch } = Vue;

    // 🧰 前端错误上报：只记录，不打扰用户
    window.addEventListener('error', (e) => {
      try {
        fetch('/api/client-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            msg: e.message || 'unknown',
            url: location.pathname,
            stack: (e.error && e.error.stack) || ''
          })
        }).catch(() => {});
      } catch (err) {}
    });
    window.addEventListener('unhandledrejection', (e) => {
      try {
        fetch('/api/client-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ msg: 'unhandled: ' + (e.reason && e.reason.message || e.reason), url: location.pathname })
        }).catch(() => {});
      } catch (err) {}
    });

    // 💡 手机/局域网访问时 localhost 指向手机自己，必须用当前域名
    const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:')
      ? 'http://localhost:3001/api'
      : location.origin + '/api';

    const TreeNode = {
      name: 'TreeNode', 
      props: ['item', 'currentPath', 'selectedFolder', 'parentPath'], 
      emits: ['select', 'select-folder', 'delete'],
      setup(props, { emit }) {
        const isOpen = ref(true);
        const fullPath = computed(() => props.parentPath ? `${props.parentPath}/${props.item.name}` : props.item.name);
        const handleClick = () => {
          if (props.item.type === 'folder') {
            isOpen.value = !isOpen.value;
            emit('select-folder', fullPath.value);
          } else {
            emit('select', fullPath.value);
            emit('select-folder', props.parentPath);
          }
        };
        return { isOpen, handleClick, fullPath };
      },
      template: `
        <div>
          <div class="node-item" :class="item.type === 'folder' ? 'folder-item' : 'file-item'" :class="{ active: currentPath === fullPath, 'active-folder': item.type === 'folder' && selectedFolder === fullPath }" @click="handleClick">
            <div style="display: flex; align-items: center; flex: 1; overflow: hidden;">
              <span v-if="item.type === 'folder'" class="arrow" :class="{ open: isOpen }">▶</span><span v-else style="width:16px; flex-shrink:0;"></span>
              <span v-if="item.type === 'folder'">📁 {{ item.name }}</span>
              <span v-else style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">📄 {{ item.name }}</span>
            </div>
            <span class="delete-btn" title="删除" @click.stop="$emit('delete', item)">✖</span>
          </div>
          
          <div v-if="item.type === 'folder' && isOpen && item.children && item.children.length > 0" style="padding-left: 15px;">
            <tree-node v-for="(child, index) in item.children" :key="index" :item="child" :current-path="currentPath" :selected-folder="selectedFolder" :parent-path="fullPath" @select="$emit('select', $event)" @select-folder="$emit('select-folder', $event)" @delete="$emit('delete', $event)" />
          </div>
        </div>
      `
    };

    const app = createApp({
      setup() {
        const dynamicPlugins = ref([]);
        const isAuthenticated = ref(false);
        const password = ref('');
        const showError = ref(false);
        const loginHint = ref(localStorage.getItem('admin_hint') || '默认密码：123456');

        // 💡 免费声明：首次登录弹一次；之后每次「版本号变了」（也就是更新过）再弹一次
        const FREE_NOTICE_VER_KEY = 'free_notice_version';
        const maybeShowFreeNotice = async (force) => {
          let cur = '';
          try {
            const r = await fetch('/version.json?t=' + Date.now());
            if (r.ok) cur = String((await r.json()).id || '');
          } catch (e) { /* 离线时也能弹 */ }
          const tag = cur || 'unknown';

          let seen = '';
          try { seen = localStorage.getItem(FREE_NOTICE_VER_KEY) || ''; } catch (e) {}
          if (!force && seen === tag) return;   // 同一版本已经看过，不打扰

          try {
            localStorage.setItem(FREE_NOTICE_VER_KEY, tag);
            localStorage.setItem('free_notice_seen', '1');   // 兼容旧标记
          } catch (e) {}

          openModal({
            type: 'alert',
            title: '🎉 欢迎使用「幻想域设定集」',
            message:
              '本系统<b style="color:#2ea043">完全免费</b>，个人开发、开源分享，' +
              '没有付费版、没有内购、没有会员。<br><br>' +
              '如果你是通过<b>付费</b>拿到它的，说明有人把免费的东西卖给了你——' +
              '请直接申请退款，并把来源告诉作者。<br><br>' +
              '凡是「收费解锁」「加群下载」「激活码」的一律与本项目无关。<br><br>' +
              '<span style="color:#d29922">支持作者的正确方式：点个 Star、提个 Issue、把这个世界写好。</span><br><br>' +
              '<span style="color:#7fc4ee">最后悄悄说一句：别顺手把作者大大的世界观文件打包搬走哦 🙈 ' +
              '——自己从零搭一遍，才长得出属于你的世界～</span><br><br>' +
              '<span style="color:#888;font-size:12px;">作者：' +
              '<a href="https://space.bilibili.com/662538781" target="_blank" style="color:#7fc4ee;text-decoration:none;">bilibili@雾之韵8296</a>' +
              '　·　官方仓库：gitee.com/amspace/wuzhiyun8296.github.io　·　代码 GPL-3.0，小说与设定保留所有权利</span>'
          });
        };

        const handleLogin = () => {
          const currentPwd = localStorage.getItem('admin_pwd') || '123456';
          if (password.value === currentPwd) {
            isAuthenticated.value = true;
            sessionStorage.setItem('admin_auth', 'true');
            setTimeout(() => { maybeShowFreeNotice(false); }, 600);
          } else {
            showError.value = true;
            password.value = '';
            setTimeout(() => { showError.value = false; }, 2000);
          }
        };

        // 💡 扩展了 modal：updateLogs 显示更新列表，loading 显示转圈，hideActions 隐藏按钮
        const MODAL_DEFAULT = {
          show: false, type: '', title: '', message: '',
          input1: '', input2: '', placeholder1: '', placeholder2: '',
          callback: null, isDanger: false, updateLogs: '',
          hideActions: false, loading: false, progress: null
        };
        const modal = ref({ ...MODAL_DEFAULT });
        const openModal = (options) => { modal.value = { ...MODAL_DEFAULT, ...options, show: true }; };
        const closeModal = () => { if (modal.value.hideActions) return; modal.value.show = false; };
        const confirmModal = () => {
          if (modal.value.callback) {
            if (modal.value.type === 'prompt-double') { modal.value.callback(modal.value.input1, modal.value.input2); } 
            else { modal.value.callback(modal.value.input1); }
          }
          closeModal();
        };

        // 💡 检测更新 → 有更新就自动下载并覆盖 → 实时显示进度 → 提示更新完成
        const isCheckingUpdate = ref(false);
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        // 💡 等服务重启回来：重启期间请求会失败，这里一直重试到成功为止
        const waitForServerBack = async (maxMs = 90000) => {
          const t0 = Date.now();
          await sleep(2500);
          while (Date.now() - t0 < maxMs) {
            try {
              const r = await fetch(`${API_BASE}/update/status?t=${Date.now()}`, { cache: 'no-store' });
              if (r.ok) {
                const d = await r.json();
                if (d && d.success && d.job && !d.job.running) return true;
              }
            } catch (e) { /* 还没起来 */ }
            await sleep(1000);
          }
          return false;
        };

        const doUpdate = async (logsHtml) => {
          openModal({
            type: 'confirm',
            title: '⏳ 正在更新',
            message: '准备更新…',
            updateLogs: logsHtml || '',
            loading: true,
            hideActions: true,
            progress: null
          });

          const started = Date.now();
          try {
            // 启动任务：后端立刻返回，真正的下载在后台跑
            await fetch(`${API_BASE}/update/start?t=${Date.now()}`);
            await sleep(300);

            let job = null;
            while (true) {
              await sleep(500);
              const res = await fetch(`${API_BASE}/update/status?t=${Date.now()}`);
              const data = await res.json();
              job = data.job || null;
              if (!job) break;

              // 实时刷新界面：阶段文案 + 百分比 + 进度条 + 日志
              const pctText = (typeof job.percent === 'number') ? `　${job.percent}%` : '';
              const hint = (job.stage === 'download' && (job.elapsed || 0) > 35)
                ? '　连不上的话会自动切到下一个源…'
                : '';
              // 💡 实时网速
              const fmtSpeed = (bps) => {
                if (!bps || bps < 1) return '';
                if (bps >= 1024 * 1024) return (bps / 1024 / 1024).toFixed(1) + ' MB/s';
                return Math.max(1, Math.round(bps / 1024)) + ' KB/s';
              };
              const sp = fmtSpeed(job.speed);
              const avg = fmtSpeed(job.avgSpeed);
              const speedLine = (sp || avg)
                ? (sp ? `<span style="color:#4ec9b0;">↓ ${sp}</span>` : '') +
                  (avg ? `<span style="color:#888;">　平均 ${avg}</span>` : '') +
                  (job.file ? `　<span style="color:#888;">${job.file}</span>` : '') +
                  (typeof job.filePercent === 'number' ? `<span style="color:#888;"> ${job.filePercent}%</span>` : '')
                : '';
              modal.value.message = `${job.message || '处理中…'}${pctText}` +
                `<br><span style="font-size:12px;color:#888;">已用时 ${job.elapsed || 0} 秒${hint}</span>` +
                (speedLine ? `<br><span style="font-size:12px;">${speedLine}</span>` : '');
              modal.value.progress = (typeof job.percent === 'number') ? job.percent : null;
              modal.value.updateLogs = (job.logs || []).map((l) => `<div>${l}</div>`).join('');

              if (!job.running) break;
              if (Date.now() - started > 6 * 60 * 1000) {
                modal.value.loading = false;
                break;
              }
            }

            if (job && job.ok) {
              const extra = `<div style="margin-top:8px;font-size:12px;color:#888;">来源：${job.source}　下载通道：${job.via || '-'}　耗时：${job.elapsed || 0} 秒</div>`;
              openModal({
                type: 'confirm',
                title: '✅ 更新完成',
                message: '新版本已经装好啦 ✨<br><br><b>正在自动重启后台服务，稍等一下页面会自己刷新…</b>' + extra,
                loading: true,
                hideActions: true
              });
              await waitForServerBack();
              openModal({
                type: 'confirm',
                title: '✅ 更新完成啦',
                message: '新版本已经生效，页面马上自动刷新 ✨' + extra,
                callback: () => { window.location.reload(); }
              });
              setTimeout(() => window.location.reload(), 1200);
            } else {
              openModal({
                type: 'confirm',
                title: '❌ 更新失败',
                message: (job && job.error ? job.error : '超时未完成') +
                  '<br><br>可以稍后再试，或让作者发更新包手动覆盖。',
                isDanger: true
              });
            }
          } catch (e) {
            openModal({
              type: 'confirm',
              title: '❌ 请求失败',
              message: `浏览器没能连上后台（${e.message}）。<br><br>请确认那个黑色的命令行窗口还开着，然后再试一次。`,
              isDanger: true
            });
          }
        };

        const checkUpdate = async () => {
          if (isCheckingUpdate.value) return;
          isCheckingUpdate.value = true;

          openModal({
            type: 'confirm',
            title: '🔄 正在检测更新',
            message: '正在连接更新服务器，请稍候...',
            loading: true,
            hideActions: true
          });

          try {
            const res = await fetch(`${API_BASE}/git/check-update`);
            const data = await res.json();

            if (!data.success) {
              openModal({ type: 'confirm', title: '⚠️ 检测失败', message: data.error || '未知错误，请检查网络或更新源配置。', isDanger: true });
              return;
            }

            if (!data.hasUpdate) {
              openModal({ type: 'confirm', title: '✅ 已是最新', message: '当前代码已经是最新版本，无需更新。' });
              return;
            }

            // 有更新：不再让用户点确认，直接进入下载
            const logsHtml = (data.logs || []).map((l) => `<div>${l}</div>`).join('');
            await doUpdate(logsHtml);
          } catch (e) {
            openModal({ type: 'confirm', title: '❌ 网络错误', message: e.message, isDanger: true });
          } finally {
            isCheckingUpdate.value = false;
          }
        };
        // 🔧 修复文件：不做版本判定，直接把本地和远端清单比对，
        //    缺失/损坏的文件重新下载（比如 .bat 变成 LF 导致闪退）
        // ---------- 🧰 工具菜单 ----------
        const toolsOpen = ref(false);
        const toolRef = ref(null);
        const toggleTools = () => { toolsOpen.value = !toolsOpen.value; };
        const closeTools = () => { toolsOpen.value = false; };

        const pickTool = (kind) => {
          closeTools();
          if (kind === 'repair') return repairFiles();
          if (kind === 'restart') return restartBackend();
        };

        // 点空白处关闭菜单
        const onDocClick = (e) => {
          if (!toolsOpen.value) return;
          const el = toolRef.value;
          if (el && !el.contains(e.target)) closeTools();
        };

        // ♻️ 重启后台
        const restartBackend = async () => {
          openModal({
            type: 'confirm',
            title: '♻️ 重启后台',
            message: '会重启本地 Node 服务（约 3-5 秒）。<br><br>' +
              '<span style="color:#e0a030;">重启期间页面会短暂打不开</span>，重启完成后页面会自动刷新。' +
              '<br><br>确定要重启吗？',
            callback: async () => {
              try {
                // 💡 先清掉可能残留的旧进程，否则重启了也还是老代码在服务
                try {
                  await fetch(`${API_BASE}/system/kill-stale`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}'
                  });
                } catch (e) { /* 老后端没有这个接口，忽略 */ }

                // 💡 重启失败一定要让用户看到原因，不能静默失败
                const res = await fetch(`${API_BASE}/update/restart?manual=1&t=${Date.now()}`);
                let data = {};
                try { data = await res.json(); } catch (e) { /* 旧后端可能返回空 */ }
                if (!res.ok || data.success === false) {
                  openModal({
                    type: 'confirm',
                    title: '❌ 重启失败',
                    message: (data.error || '后台没能重新拉起来。') +
                      '<br><br>手动处理：<br>1. 关掉所有黑色命令行窗口<br>2. 任务管理器结束所有 <b>node.exe</b><br>3. 重新双击「一键启动.vbs」',
                    isDanger: true
                  });
                  return;
                }
                openModal({
                  type: 'confirm',
                  title: '♻️ 正在重启',
                  message: '正在重启后台服务，请稍候…',
                  loading: true,
                  hideActions: true
                });
                await waitForServerBack();
                window.location.reload();
              } catch (e) {
                openModal({ type: 'confirm', title: '❌ 重启失败', message: e.message, isDanger: true });
              }
            }
          });
        };

        // 🔧 修复文件：先弹确认（会覆盖本地未推送的改动），确认后才执行
        const repairFiles = () => {
          if (isCheckingUpdate.value) return;
          openModal({
            type: 'confirm',
            title: '🔧 修复文件',
            message: '会从远程仓库重新下载<b>缺失或损坏</b>的文件。' +
              '<br><br><span style="color:#e0a030;">注意：本地未推送的修改会被覆盖</span>（覆盖前会自动备份到 .update_backup）。' +
              '<br><br>确定要修复吗？',
            callback: () => { doRepair(); }
          });
        };

        const doRepair = async () => {
          if (isCheckingUpdate.value) return;
          isCheckingUpdate.value = true;
          const startedAt = Date.now();
          try {
            openModal({
              type: 'confirm',
              title: '🔧 正在修复',
              message: '正在核对本地文件…',
              updateLogs: '',
              loading: true,
              hideActions: true,
              progress: null
            });
            await fetch(`${API_BASE}/update/repair?t=${Date.now()}`, { method: 'POST' });
            await sleep(300);

            let job = null;
            while (true) {
              await sleep(500);
              const res = await fetch(`${API_BASE}/update/status?t=${Date.now()}`);
              const data = await res.json();
              job = data.job || null;
              if (!job) break;

              const pct = (typeof job.percent === 'number') ? `　${job.percent}%` : '';
              modal.value.message = `${job.message || '处理中…'}${pct}`;
              modal.value.progress = (typeof job.percent === 'number') ? job.percent : null;
              modal.value.updateLogs = (job.logs || []).map((l) => `<div>${l}</div>`).join('');
              if (!job.running) break;
              if (Date.now() - startedAt > 6 * 60 * 1000) break;
            }

            if (job && job.ok) {
              openModal({
                type: 'confirm',
                title: '✅ 修复完成',
                message: '缺失或损坏的文件已经重新下载好 ✨<br><br><b>正在自动重启后台服务，稍等一下页面会自己刷新…</b>',
                loading: true,
                hideActions: true
              });
              await waitForServerBack();
              setTimeout(() => window.location.reload(), 800);
            } else {
              openModal({
                type: 'confirm',
                title: '❌ 修复失败',
                message: (job && job.error ? job.error : '超时未完成') +
                  '<br><br>可能是网络问题，稍后再试一次；还不行就把控制台日志发给作者。',
                isDanger: true
              });
            }
          } catch (e) {
            openModal({ type: 'confirm', title: '❌ 请求失败', message: e.message, isDanger: true });
          } finally {
            isCheckingUpdate.value = false;
          }
        };

        const changePassword = () => {
          openModal({
            type: 'prompt-double', title: '🔐 修改安全密码', message: '第一个输入框填写新密码，第二个填写提示语。若新密码留空，则恢复默认 123456。', placeholder1: '请输入新密码', placeholder2: '请输入密码提示语 (下次登录显示)',
            callback: (newPwd, newHint) => {
              if (newPwd.trim() === '') {
                localStorage.removeItem('admin_pwd'); localStorage.removeItem('admin_hint'); loginHint.value = '默认密码：123456'; showToast('已恢复默认密码'); return;
              }
              localStorage.setItem('admin_pwd', newPwd);
              if (newHint && newHint.trim() !== '') { localStorage.setItem('admin_hint', newHint); loginHint.value = newHint; } 
              else { localStorage.removeItem('admin_hint'); loginHint.value = '密码已自定义，请凭记忆输入'; }
              showToast('✅ 密码与提示修改成功');
            }
          });
        };

        const logout = () => {
          openModal({
            type: 'confirm', title: '🚪 退出登录', message: '确定要退出主控台吗？', isDanger: true,
            callback: async () => {
              sessionStorage.removeItem('admin_auth');
              isAuthenticated.value = false;
              password.value = '';

              // 💡 远程登录的会话存在服务端，必须一起注销
              try {
                await fetch(`${API_BASE}/auth/logout`, { method: 'POST' });
              } catch (e) { /* 忽略 */ }

              // 远程模式：退回专用登录页（那里输远程访问码）
              try {
                const r = await fetch('/api/auth/status?t=' + Date.now(), { cache: 'no-store' });
                const st = await r.json();
                if (st && st.required) { location.replace('/login.html'); return; }
              } catch (e) { /* 忽略 */ }
            }
          });
        };

        const navGroupRef = ref(null);
        const handleNavWheel = (e) => {
          if (navGroupRef.value) {
            navGroupRef.value.scrollLeft += e.deltaY;
          }
        };

        const currentTab = ref('dashboard');
        const navDrawer = ref(false);

        // 💡 抽屉里点插件：切过去并关掉抽屉
        const goTab = (id) => {
          currentTab.value = id;
          navDrawer.value = false;
        };

        // 💡 手机端有手机版页面就用手机版，否则用原页面
        const isPhoneView = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent || '') || window.innerWidth < 760;
        // 🔍 搜索点开文件：从仪表盘传过来的待打开路径
        const writerOpenPath = ref('');
        const pluginSrc = computed(() => {
          const id = currentTab.value;
          if (isPhoneView) {
            const hit = (dynamicPlugins.value || []).find((p) => p.id === id);
            // 💡 只有真的存在 xxx.mobile.html 才跳转，否则会 404
            if (hit && hit.mobileFile) return `plugin/${id}.mobile.html`;
          }
          // 打开指定章节时带上路径参数，沉浸码字会自己打开
          if (id === 'writer' && writerOpenPath.value) {
            return `plugin/writer.html?open=${encodeURIComponent(writerOpenPath.value)}`;
          }
          return `plugin/${id}.html`;
        });

        // 顶栏显示当前插件名
        const currentTitle = computed(() => {
          if (currentTab.value === 'dashboard') return '仪表盘';
          const hit = (dynamicPlugins.value || []).find((p) => p.id === currentTab.value);
          return hit ? hit.name : (currentTab.value === 'article' ? '文章编辑' : currentTab.value);
        });
        const tree = ref([]); const content = ref(''); const currentPath = ref(''); const selectedFolder = ref('');

        // ↶ 文章编辑的撤销/重做（自己维护，避免浏览器把"上一个文件"撤回来）
        const mdUndoStack = ref([]);
        const mdRedoStack = ref([]);
        const canMdUndo = computed(() => mdUndoStack.value.length > 1);
        const canMdRedo = computed(() => mdRedoStack.value.length > 0);
        let mdSnapshotTimer = null;

        // 📱 网文模式：回车插入空行（默认开启，记住上次选择）
        const webMode = ref((() => {
          try {
            const saved = localStorage.getItem('mw_article_webmode');
            return saved === null ? true : saved === '1';
          } catch (e) { return true; }
        })());
        // 📱 网文模式：默认开启，记住上次选择
        const webBlankLines = ref((() => {
          try {
            const saved = parseInt(localStorage.getItem('mw_article_blanklines') || '2', 10);
            return saved === 1 ? 1 : 2;
          } catch (e) { return 2; }
        })());
        watch(webMode, (val) => {
          try { localStorage.setItem('mw_article_webmode', val ? '1' : '0'); } catch (e) {}
        });
        watch(webBlankLines, (val) => {
          try { localStorage.setItem('mw_article_blanklines', String(val)); } catch (e) {}
        });

        const onMdKeydown = (e) => {
          if (!webMode.value) return;
          if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            const ta = e.target;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const text = content.value || '';
            // 已经是空行结尾就只补一个换行，避免越按越空
            const before = text.slice(0, start);
            // 网文排版：段落之间空 N 行 = N+1 个换行
            const need = webBlankLines.value + 1;
            const trailing = (before.match(/\n+$/) || [''])[0].length;
            const insert = trailing >= need ? '' : '\n'.repeat(need - trailing);
            content.value = text.slice(0, start) + insert + text.slice(end);
            clearTimeout(mdSnapshotTimer);
            mdSnapshotTimer = setTimeout(pushMdSnapshot, 400);
            nextTick(() => {
              ta.selectionStart = ta.selectionEnd = start + insert.length;
              const gap = ta.scrollHeight - ta.scrollTop - ta.clientHeight;
              if (gap < 60) ta.scrollTop = ta.scrollHeight;
            });
          }
        };

        const pushMdSnapshot = () => {
          const text = content.value || '';
          const st = mdUndoStack.value;
          if (st.length && st[st.length - 1] === text) return;
          st.push(text);
          if (st.length > 200) st.shift();
          mdRedoStack.value = [];
        };

        // 打字停下 400ms 记一笔
        const onMdInput = () => {
          clearTimeout(mdSnapshotTimer);
          mdSnapshotTimer = setTimeout(pushMdSnapshot, 400);
          // 光标跟随：敲到最后一屏时把滚动条带到底（浏览器有时不跟手）
          const ta = document.getElementById('md-editor');
          if (ta) {
            const gap = ta.scrollHeight - ta.scrollTop - ta.clientHeight;
            if (gap < 48) ta.scrollTop = ta.scrollHeight;
          }
        };

        const mdUndo = () => {
          const st = mdUndoStack.value;
          if (st.length <= 1) return;
          mdRedoStack.value.push(st.pop());
          content.value = st[st.length - 1];
        };

        const mdRedo = () => {
          const rs = mdRedoStack.value;
          if (!rs.length) return;
          const text = rs.pop();
          mdUndoStack.value.push(text);
          content.value = text;
        };

        const renderedHtml = computed(() => {
          if (!content.value || typeof content.value !== 'string') return '';
          if (typeof marked === 'undefined') return '<div style="color:#a82626;">Marked 库未加载。</div>';
          try {
            let mdText = content.value.replace(/\[\[(.*?)\]\]/g, (match, p1) => {
              const cleanP1 = p1.replace(/\\/g, '/');
              return `<a href="/${cleanP1}">🔗 ${cleanP1}</a>`;
            });
            marked.setOptions({ gfm: true, breaks: true });
            return marked.parse(mdText);
          } catch (e) { return '<div style="color:#a82626;">语法解析出错</div>'; }
        });
        
        const fetchTree = async () => { try { const res = await fetch(`${API_BASE}/files`); tree.value = await res.json(); } catch (e) {} };

        const loadFile = async (path) => { 
          try {
            const res = await fetch(`${API_BASE}/file?path=${encodeURIComponent(path)}`); 
            const data = await res.json(); content.value = data.content || ''; currentPath.value = path; 
            // 换文件时把历史栈重置到当前内容，绝不让撤销串到上一个文件
            mdUndoStack.value = [content.value];
            mdRedoStack.value = [];
          } catch (e) { showToast('读取文件失败', true); }
        };

        const saveFile = async () => {
          if (!currentPath.value) return;
          await fetch(`${API_BASE}/file`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: currentPath.value, content: content.value }) });
          showToast('✅ 文章保存成功');
        };

        const newFile = () => {
          // 💡 根目录下只允许新建文件夹：根目录放的是系统页（首页/地图/时间线…），
          //    在这里新建的文档不会出现在左侧目录里，容易被误以为丢了
          if (!selectedFolder.value) {
            showToast('根目录不能直接建文件，请先点左侧一个文件夹（或新建文件夹）', true);
            return;
          }
          const prefix = `${selectedFolder.value}/`;
          openModal({
            type: 'prompt', title: '📝 新建文件', message: `将在 [${selectedFolder.value}] 下创建。无需输入路径和后缀。`, placeholder1: '请输入文件名',
            callback: (filename) => {
              if (!filename) return;
              let cleanName = filename.trim();
              if (!cleanName.endsWith('.md')) cleanName += '.md';
              const fullPath = `${prefix}${cleanName}`;
              currentPath.value = fullPath; content.value = `# ${cleanName.replace('.md', '')}\n　　`;
              saveFile(); fetchTree();
            }
          });
        };

        const newFolder = () => {
          const prefix = selectedFolder.value ? `${selectedFolder.value}/` : '';
          openModal({
            type: 'prompt', title: '📁 新建文件夹', message: `将在 [${selectedFolder.value || '根目录'}] 下创建。`, placeholder1: '请输入文件夹名',
            callback: (folderName) => {
              if (!folderName) return;
              const fullPath = `${prefix}${folderName.trim()}/.gitkeep`;
              fetch(`${API_BASE}/file`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: fullPath, content: '' }) }).then(() => fetchTree());
            }
          });
        };

        const deleteNode = (item) => {
          openModal({
            type: 'confirm', title: '⚠️ 确认删除', message: `确定要删除 [${item.name}] 吗？此操作不可逆！`, isDanger: true,
            callback: async () => {
              try {
                const res = await fetch(`${API_BASE}/delete`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: item.path }) });
                const data = await res.json();
                if (data.success) {
                  showToast('✅ 已成功删除'); fetchTree(); 
                  if (currentPath.value === item.path || currentPath.value.startsWith(item.path + '/')) { content.value = ''; currentPath.value = ''; }
                } else { showToast('删除失败: ' + data.error, true); }
              } catch (e) { showToast('删除请求失败', true); }
            }
          });
        };

        const showTableModal = ref(false); const tableRows = ref(3); const tableCols = ref(3);
        const insertTable = async () => {
          let mdTable = '\n\n';
          mdTable += '| ' + Array.from({length: tableCols.value}).map((_, i) => `表头 ${i+1}`).join(' | ') + ' |\n';
          mdTable += '| ' + Array.from({length: tableCols.value}).map(() => `---`).join(' | ') + ' |\n';
          for (let r = 0; r < tableRows.value; r++) { 
            mdTable += '| ' + Array.from({length: tableCols.value}).map(() => `内容`).join(' | ') + ' |\n'; 
          }
          mdTable += '\n';
          
          const textarea = document.getElementById('md-editor');
          if (textarea) {
            const startPos = textarea.selectionStart; const endPos = textarea.selectionEnd;
            content.value = content.value.substring(0, startPos) + mdTable + content.value.substring(endPos);
            await nextTick(); textarea.focus(); textarea.setSelectionRange(startPos + mdTable.length, startPos + mdTable.length);
          } else { content.value += mdTable; }
          showTableModal.value = false; showToast('✅ 表格已插入');
        };

        const showToast = (msg, isError = false) => {
          const oldToast = document.getElementById('custom-toast'); if (oldToast) oldToast.remove();
          const toast = document.createElement('div'); toast.id = 'custom-toast'; toast.innerText = msg;
          toast.style = `position:fixed; bottom:30px; right:30px; background:${isError ? '#a82626' : '#2ea043'}; color:#fff; padding:12px 24px; border-radius:6px; z-index:99999; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-weight: bold;`;
          document.body.appendChild(toast); setTimeout(() => toast.remove(), 2500);
        };

        const handleKeydown = (e) => {
          // 文章编辑：Ctrl+S 保存
          if ((e.ctrlKey || e.metaKey) && e.key === 's' && currentTab.value === 'article') {
            e.preventDefault();
            saveFile();
            return;
          }
          // 文章编辑：Ctrl+Z 撤销 / Ctrl+Y 或 Ctrl+Shift+Z 重做
          // 💡 接管浏览器原生撤销：原生会把"上一个文件的内容"也当成可撤销操作，
          //    切文件后按 Ctrl+Z 可能把旧文件内容撤回来，很危险。
          if ((e.ctrlKey || e.metaKey) && currentTab.value === 'article') {
            const k = String(e.key || '').toLowerCase();
            if (k === 'z' && !e.shiftKey) { e.preventDefault(); mdUndo(); }
            else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); mdRedo(); }
          }
        };
        
        // 💡 会话过期（服务端 401）时自动回到登录页
        const originalFetch = window.fetch.bind(window);
        window.fetch = async (...args) => {
          const res = await originalFetch(...args);
          if (res.status === 401) {
            try {
              const data = await res.clone().json();
              if (data && data.needLogin && !location.pathname.endsWith('/login.html')) {
                location.replace('/login.html');
              }
            } catch (e) { /* 非 JSON 忽略 */ }
          }
          return res;
        };

        const loadDynamicPlugins = () => {
          fetch(`${API_BASE}/plugins/list?t=${Date.now()}`)
            .then(res => res.json())
            .then(data => { 
              dynamicPlugins.value = Array.isArray(data) 
                ? data.filter(p => !p.hideBackend) 
                : []; 
            })
            .catch(() => {});
        };

        const handleIframeMessage = (e) => {
          if (!e.data) return;
          // 💡 仪表盘的"去建世界观 / 直接开写"按钮，帮用户切到对应插件
          if (e.data.type === 'NAVIGATE' && e.data.id) {
            currentTab.value = String(e.data.id);
          }
          // 🔍 搜索结果点开：书库 → 沉浸码字；设定集 → 文章编辑
          if (e.data.type === 'OPEN_FILE' && e.data.path) {
            const p = String(e.data.path).replace(/\\/g, '/');
            if (p.startsWith('library/')) {
              writerOpenPath.value = p.slice('library/'.length);
              currentTab.value = 'writer';
            } else if (p.startsWith('website/docs/')) {
              currentTab.value = 'article';
              nextTick(() => loadFile(p.slice('website/docs/'.length)));
            }
          }
          if (e.data.type === 'REFRESH_PLUGINS') {
            loadDynamicPlugins();
          }
          // 💡 推送成功（没有 Gitee 提醒时也要给个反馈）
          if (e.data.type === 'PUSH_DONE') {
            if (typeof showToast === 'function') {
              showToast('✅ 已推送' + (e.data.version ? '（' + e.data.version + '）' : ''));
            }
            loadDynamicPlugins();
          }
          // 💡 一键推送成功后，用弹窗提醒去同步 Gitee
          //    （已经自动同步过就只提示一句，不再催手动同步）
          if (e.data.type === 'GITEE_SYNCED') {
            if (typeof showToast === 'function') {
              showToast('✅ 已发布并同步到 Gitee' + (e.data.version ? '（' + e.data.version + '）' : ''));
            }
            loadDynamicPlugins();
          }
          if (e.data.type === 'GITEE_SYNC_HINT') {
            const d = e.data;
            openModal({
              type: 'confirm',
              title: '📤 已推送到 GitHub',
              message: `本次版本：<b>${d.version || '-'}</b><br><br>` +
                '客户端会先读 GitHub，连不上才切 Gitee。<br>' +
                '<b>Gitee 没同步的话，墙内的朋友会拉不到新版。</b>' +
                (d.repoUrl ? `<br><br>Gitee 仓库：<br><a href="${d.repoUrl}" target="_blank" style="color:#4aa3df;">${d.repoUrl}</a>` : '') +
                (d.settingsUrl ? `<br><br>镜像管理：<a href="${d.settingsUrl}" target="_blank" style="color:#4aa3df;">点这里打开</a>` : '') +
                '<br><br><span style="color:#888;font-size:12px;">路径：仓库页 → 管理 → 仓库镜像管理 → 手动同步</span>',
              callback: () => { if (d.repoUrl) window.open(d.repoUrl, '_blank'); }
            });
          }
        };

        onMounted(() => {
          // 💡 手机访问且未登录 → 使用专门的手机版准入页面
          const ua = navigator.userAgent || '';
          // ?mobile=1 可强制走手机登录页（方便在电脑上预览/测试）
          const forceMobile = new URLSearchParams(location.search).get('mobile') === '1';
          const isPhone = forceMobile || /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(ua) || window.innerWidth < 760;
          const logged = sessionStorage.getItem('admin_auth') === 'true';
          if (isPhone && !logged) {
            location.replace('/login.html');
            return;
          }

          document.addEventListener('click', onDocClick);
          if (sessionStorage.getItem('admin_auth') === 'true') { isAuthenticated.value = true; }
          fetchTree(); 
          window.addEventListener('keydown', handleKeydown);
          
          loadDynamicPlugins();
          window.addEventListener('message', handleIframeMessage);

          // ?welcome=1 可以直接预览这份免费声明（不影响正常登录流程）
          try {
            if (new URLSearchParams(location.search).get('welcome') === '1') {
              setTimeout(() => { maybeShowFreeNotice(true); }, 400);
            }
          } catch (e) {}
        });
        
        onUnmounted(() => {
          document.removeEventListener('click', onDocClick);
          window.removeEventListener('keydown', handleKeydown);
          window.removeEventListener('message', handleIframeMessage);
        });

        return { 
          isAuthenticated, password, showError, handleLogin, loginHint, changePassword, logout,
          currentTab, tree, content, currentPath, selectedFolder, renderedHtml, 
          loadFile, saveFile, newFile, newFolder, deleteNode,
          mdUndo, mdRedo, canMdUndo, canMdRedo, onMdInput, webMode, webBlankLines, onMdKeydown,
          showTableModal, tableRows, tableCols, insertTable,
