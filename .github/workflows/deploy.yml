name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 💡 关键修复：移除缓存配置，避免因找不到 package-lock.json 而报错
          # cache: npm
          # cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: |
          cd website
          npm install

      - name: Build with VitePress
        run: |
          cd website
          npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 💡 注意：路径根据你的实际构建输出目录来定
          # 如果你的 VitePress 配置中 outDir 没有特别指定，默认就是 website/.vitepress/dist
          path: website/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4