<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>幻想域势力图谱</title>
  <!-- 引入 ECharts 国内 CDN -->
  <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
  <style>
    body { 
      margin: 0; 
      background-color: #1e1e1e; 
      color: #fff; 
      font-family: sans-serif; 
      display: flex; 
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    h2 { margin: 20px 0; color: #0e639c; }
    #chart-container { 
      width: 100%; 
      flex: 1; 
      max-height: 600px;
    }
  </style>
</head>
<body>
  <h2>⚔️ 幻想域势力关系图</h2>
  <div id="chart-container"></div>

  <script>
    // 初始化 ECharts
    var chart = echarts.init(document.getElementById('chart-container'), 'dark');

    // 数据节点与连线
    var option = {
      backgroundColor: '#1e1e1e',
      tooltip: {},
      legend: [{ data: ['阵营', '核心人物'], textStyle: { color: '#ccc' } }],
      series: [{
        type: 'graph',
        layout: 'force',
        symbolSize: 50,
        roam: true, // 允许鼠标缩放和拖拽
        label: { show: true, color: '#fff', fontSize: 12 },
        force: { repulsion: 300, edgeLength: 120 },
        edgeSymbol: ['circle', 'arrow'],
        edgeSymbolSize: [4, 10],
        categories: [
          { name: '阵营', itemStyle: { color: '#0e639c' } },
          { name: '核心人物', itemStyle: { color: '#a82626' } }
        ],
        data: [
          { name: '幻想域', category: 0, symbolSize: 70 },
          { name: '帝国', category: 0, symbolSize: 70 },
          { name: '魔族', category: 0, symbolSize: 70 },
          { name: '冒险者公会', category: 0, symbolSize: 60 },
          
          { name: '陈默', category: 1 },
          { name: '苏铭羽', category: 1 },
          { name: '十二圆桌骑士', category: 1 },
          { name: '魔王', category: 1 }
        ],
        links: [
          { source: '陈默', target: '幻想域', label: { show: true, formatter: '成员' } },
          { source: '苏铭羽', target: '幻想域', label: { show: true, formatter: '成员' } },
          { source: '十二圆桌骑士', target: '帝国', label: { show: true, formatter: '实际统治' } },
          { source: '魔王', target: '魔族', label: { show: true, formatter: '统领' } },
          { source: '幻想域', target: '魔族', label: { show: true, formatter: '暗中合作' }, lineStyle: { color: '#2ea043', type: 'dashed' } },
          { source: '幻想域', target: '帝国', label: { show: true, formatter: '敌对' }, lineStyle: { color: '#a82626' } },
          { source: '冒险者公会', target: '幻想域', label: { show: true, formatter: '密切合作' } }
        ],
        lineStyle: { color: '#555', width: 2, curveness: 0.1 }
      }]
    };

    // 渲染图表
    chart.setOption(option);
    
    // 监听窗口大小变化以自适应
    window.addEventListener('resize', () => { chart.resize(); });
  </script>
</body>
</html>
