<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>幻想域 - 主控启动台</title>
  <style>
    body { background: #121212; color: #fff; font-family: 'Microsoft YaHei', sans-serif; height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    
    /* 加载动画 */
    .loader { width: 60px; height: 60px; border: 4px solid #333; border-top: 4px solid #0e639c; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    /* 主界面元素 */
    #loading-area { display: flex; flex-direction: column; align-items: center; transition: opacity 0.5s; }
    #selection-area { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.8s ease-out; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    h1 { font-size: 32px; letter-spacing: 4px; color: #fff; margin-bottom: 10px; text-shadow: 0 0 20px rgba(14, 99, 156, 0.5); }
    p { color: #888; font-size: 15px; margin-bottom: 40px; letter-spacing: 1px; }
    
    /* 两个巨大的选择卡片 */
    .choice-cards { display: flex; gap: 30px; }
    .card { 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 200px; height: 220px; background: #1e1e1e; border: 1px solid #333; 
      border-radius: 12px; text-decoration: none; color: #ccc; transition: 0.3s; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; overflow: hidden;
    }
    .card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
    .card .icon { font-size: 50px; margin-bottom: 15px; transition: 0.3s; }
    .card h3 { margin: 0 0 8px 0; font-size: 18px; color: #fff; }
    .card p { margin: 0; font-size: 12px; color: #888; text-align: center; padding: 0 15px; line-height: 1.5; }
    
    /* 前台卡片专属样式 */
    .card.novel { border-top: 4px solid #0e639c; }
    .card.novel:hover { border-color: #1177bb; background: #1a2a3a; }
    .card.novel:hover .icon { transform: scale(1.2); }
    
    /* 后台卡片专属样式 */
    .card.admin { border-top: 4px solid #2ea043; }
    .card.admin:hover { border-color: #3fb950; background: #1a2a1e; }
    .card.admin:hover .icon { transform: scale(1.2); }
  </style>
</head>
<body>

  <!-- 加载阶段的界面 -->
  <div id="loading-area">
    <div class="loader"></div>
    <h2 style="color: #ddd; font-weight: normal; letter-spacing: 2px; margin: 0;">幻想写作系统正在唤醒</h2>
    <p style="margin-top: 10px;">正在启动本地数据引擎与星网矩阵...</p>
  </div>

  <!-- 启动完成后的选择界面 -->
  <div id="selection-area">
    <h1>幻想写作</h1>
    <p>系统已就绪，请选择您要前往的终端</p>
    
    <div class="choice-cards">
      <!-- 进入前台 -->
      <a href="http://localhost:5173" class="card novel" target="_blank">
        <div class="icon">📖</div>
        <h3>小说前台</h3>
        <p>阅读小说、查看时间线与交互地图</p>
      </a>
      
      <!-- 进入后台 -->
      <a href="http://localhost:3001" class="card admin" target="_blank">
        <div class="icon">⚙️</div>
        <h3>创作后台</h3>
        <p>沉浸码字、管理设定与一键推送</p>
      </a>
    </div>
  </div>

  <script>
    // 模拟 1.5 秒的加载过程（等待后台完全预热）
    setTimeout(() => {
      // 隐藏加载区
      const loadingArea = document.getElementById('loading-area');
      loadingArea.style.opacity = '0';
      
      setTimeout(() => {
        loadingArea.style.display = 'none';
        // 显示选择区
        document.getElementById('selection-area').style.display = 'flex';
      }, 500);

    }, 1500);
  </script>
</body>
</html>
