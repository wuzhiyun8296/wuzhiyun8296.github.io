<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>幻想域 - 主控启动台</title>
  <style>
    body { background: #121212; color: #fff; font-family: 'Microsoft YaHei', sans-serif; height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    
    /* 通用面板控制 */
    .panel { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.5s ease-out; width: 100%; max-width: 850px; }
    .panel.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    /* ====== 1. 加载中状态 ====== */
    .loader { width: 60px; height: 60px; border: 4px solid #333; border-top: 4px solid #0e639c; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    h1 { font-size: 32px; letter-spacing: 4px; color: #fff; margin-bottom: 10px; text-shadow: 0 0 20px rgba(14, 99, 156, 0.5); }
    p { color: #888; font-size: 15px; margin-bottom: 40px; letter-spacing: 1px; }
    
    /* ====== 2. 成功选择界面 ====== */
    .choice-cards { display: flex; gap: 30px; }
    .card { 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 200px; height: 220px; background: #1e1e1e; border: 1px solid #333; 
      border-radius: 12px; text-decoration: none; color: #ccc; transition: 0.3s; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; overflow: hidden;
    }
    .card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
    .card .icon { font-size: 50px; margin-bottom: 15px; transition: 0.3s; }
    .card h3 { margin: 0 0 8px 0; font-size: 18px; color: #fff; }
    .card p { margin: 0; font-size: 12px; color: #888; text-align: center; padding: 0 15px; line-height: 1.5; }
    .card.novel { border-top: 4px solid #0e639c; }
    .card.novel:hover { border-color: #1177bb; background: #1a2a3a; }
    .card.novel:hover .icon { transform: scale(1.2); }
    .card.admin { border-top: 4px solid #2ea043; }
    .card.admin:hover { border-color: #3fb950; background: #1a2a1e; }
    .card.admin:hover .icon { transform: scale(1.2); }

    /* ====== 3. 启动失败 & 诊断大屏 ====== */
    .error-box { background: #252526; border: 1px solid #a82626; border-radius: 12px; width: 100%; padding: 30px; box-shadow: 0 10px 30px rgba(168, 38, 38, 0.2); box-sizing: border-box; }
    .error-title { color: #ff6b6b; font-size: 22px; margin-top: 0; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #333; padding-bottom: 15px;}
    .error-desc { color: #ccc; font-size: 14px; line-height: 1.6; margin-bottom: 20px; background: rgba(168,38,38,0.1); padding: 15px; border-radius: 6px; border-left: 4px solid #a82626; }
    
    .diag-list { background: #121212; border: 1px solid #333; border-radius: 8px; padding: 15px; max-height: 250px; overflow-y: auto; font-family: Consolas, monospace; font-size: 13px; margin-bottom: 25px;}
    .diag-item { padding: 10px 0; border-bottom: 1px dashed #333; display: flex; justify-content: space-between; align-items: center; }
    .diag-item:last-child { border-bottom: none; }
    .diag-item .name { color: #aaa; font-weight: bold; }
    .diag-item .msg { color: #666; font-size: 12px; margin-top: 4px; }
    
    .status-ok { color: #2ea043; background: rgba(46,160,67,0.1); padding: 2px 6px; border-radius: 4px; }
    .status-warning { color: #d29922; background: rgba(210,153,34,0.1); padding: 2px 6px; border-radius: 4px; }
    .status-error { color: #ff6b6b; background: rgba(168,38,38,0.2); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    
    /* 按钮区域，现在只有关闭按钮，居中显示 */
    .action-btns { display: flex; justify-content: center; align-items: center; }
    .btn { background: #333; color: #ccc; border: 1px solid #555; padding: 10px 30px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; transition: 0.2s; }
    .btn:hover { background: #444; color: #fff; }
  </style>
</head>
<body>

  <!-- 1. 加载中 -->
  <div id="loading-panel" class="panel active">
    <div class="loader"></div>
    <h2 style="color: #ddd; font-weight: normal; letter-spacing: 2px; margin: 0;">幻想写作系统正在唤醒</h2>
    <p id="loading-text" style="margin-top: 10px;">正在探测服务状态...</p>
    <div style="font-size: 12px; color: #555; margin-top: 10px; cursor: pointer;" onclick="showErrorPanel('强制跳过等待，查看诊断结果。')">如果卡住不动，点击这里</div>
  </div>

  <!-- 2. 启动成功 -->
  <div id="success-panel" class="panel">
    <h1>幻想写作</h1>
    <p>系统已就绪，请选择您要前往的终端</p>
    <div class="choice-cards">
      <a href="http://localhost:5173" class="card novel" target="_blank">
        <div class="icon">📖</div>
        <h3>小说前台</h3>
        <p>阅读小说、查看时间线与交互地图</p>
      </a>
      <a href="http://localhost:3001" class="card admin" target="_blank">
        <div class="icon">⚙️</div>
        <h3>创作后台</h3>
        <p>沉浸码字、管理设定与一键推送</p>
      </a>
    </div>
  </div>

  <!-- 3. 启动失败诊断 -->
  <div id="error-panel" class="panel">
    <div class="error-box">
      <h2 class="error-title">⚠️ 启动超时，环境异常</h2>
      <div class="error-desc" id="error-message">
        系统未能按时唤醒。请检查下方环境诊断结果，修复后重新启动。
      </div>
      
      <div class="diag-list" id="diag-list">
        <div style="color: #888;">正在获取环境诊断信息...</div>
      </div>
      
      <div class="action-btns">
        <a href="javascript:window.close()" class="btn">关闭页面</a>
      </div>
    </div>
  </div>

  <script>
    let backendReady = false;
    let frontendReady = false;
    let timer = null;

    // 带有超时机制的探活函数（防止 fetch 卡住导致页面死机）
    const checkHealth = async (url) => {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 1000); // 1秒超时
      try {
        await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        return true;
      } catch (e) {
        clearTimeout(timeoutId);
        return false;
      }
    };

    // 获取详细诊断数据
    const fetchDiagnostic = async () => {
      try {
        const res = await fetch('http://localhost:3001/api/diagnostic?t=' + Date.now());
        if (!res.ok) return;
        const data = await res.json();
        
        const listEl = document.getElementById('diag-list');
        listEl.innerHTML = '';
        
        data.forEach(item => {
          let statusText = item.status === 'ok' ? '正常' : (item.status === 'warning' ? '警告' : '错误');
          let statusClass = 'status-' + item.status;
          
          listEl.innerHTML += `
            <div class="diag-item">
              <div>
                <div class="name">${item.name}</div>
                <div class="msg">${item.msg}</div>
              </div>
              <span class="${statusClass}">${statusText}</span>
            </div>
          `;
        });
      } catch (e) {
        document.getElementById('diag-list').innerHTML = '<div style="color:#ff6b6b;">无法连接后端诊断接口，原因可能是 Node.js 未安装或 server.js 报错。</div>';
      }
    };

    // 显示错误面板
    const showErrorPanel = async (reason) => {
      if (timer) clearInterval(timer);
      document.getElementById('loading-panel').classList.remove('active');
      document.getElementById('error-panel').classList.add('active');
      
      if (reason) document.getElementById('error-message').innerHTML = reason;
      
      if (backendReady) {
        await fetchDiagnostic();
      } else {
        document.getElementById('error-message').innerHTML = '后台端口(3001)未能启动。<br>请确认是否已安装 Node.js 环境，以及是否在项目根目录运行过 <b>npm install</b>。';
        await fetchDiagnostic(); // 尝试拉取，拉不到会有红字提示
      }
    };

    // 主流程控制
    const initSystem = async () => {
      let attempts = 0;
      const maxAttempts = 20; // 20次 * 500ms = 10秒超时
      const textEl = document.getElementById('loading-text');
      
      timer = setInterval(async () => {
        attempts++;
        
        // 显示动态秒数，让用户知道没死机
        textEl.innerText = `正在探测服务状态... (已等待 ${Math.floor(attempts * 0.5)} 秒)`;

        if (!frontendReady) frontendReady = await checkHealth('http://localhost:5173');
        if (!backendReady) backendReady = await checkHealth('http://localhost:3001');

        // 全部起来了！显示成功界面
        if (frontendReady && backendReady) {
          clearInterval(timer);
          document.getElementById('loading-panel').classList.remove('active');
          document.getElementById('success-panel').classList.add('active');
          return;
        }

        // 超时处理
        if (attempts >= maxAttempts) {
          if (backendReady && !frontendReady) {
            showErrorPanel('后台(3001)已启动，但前台(5173)未响应。可能是 VitePress 编译较慢或报错，请查看 dev_log.txt 日志。');
          } else if (!backendReady && frontendReady) {
            showErrorPanel('前台(5173)已启动，但后台(3001)未响应。请查看 server_log.txt 日志。');
          } else {
            showErrorPanel('前台与后台均未启动。请检查命令行窗口是否闪退，或是否安装了 Node.js。');
          }
        }
      }, 500);
    };

    initSystem();
  </script>
</body>
</html>
